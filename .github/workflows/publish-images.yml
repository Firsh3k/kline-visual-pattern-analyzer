# 发布预构建镜像到 GHCR，供群晖 NAS 等自托管环境直接拉取（NAS 不再需要访问 Docker Hub / PyPI / npm）。
# 触发：推送到 release/nas 分支，或推送 v6.* 标签。不做定时运行。
name: publish-images
on:
  push:
    branches: [release/nas]
    tags: ['v6.*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Version
      id: v
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="v6.0.0-nas.$(date -u +%Y%m%d)-${GITHUB_SHA::7}"; fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      env:
        V: ${{ steps.v.outputs.version }}
      run: |
        OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')
        A=ghcr.io/$OWNER/kline-analysis-api; B=ghcr.io/$OWNER/kline-bff
        docker build -f services/analysis_api/Dockerfile \
          --build-arg ENGINE_VERSION="$V" --build-arg ENGINE_COMMIT="$GITHUB_SHA" --build-arg BUILD_TIME="${{ steps.v.outputs.time }}" \
          -t "$A:$V" -t "$A:nas" .
        docker build -f apps/bff/Dockerfile \
          --build-arg RELEASE_VERSION="$V" --build-arg RELEASE_COMMIT="$GITHUB_SHA" \
          --build-arg RELEASED_AT="${{ steps.v.outputs.day }}" --build-arg RELEASE_ENV=staging \
          -t "$B:$V" -t "$B:nas" .
        for t in "$A:$V" "$A:nas" "$B:$V" "$B:nas"; do docker push "$t"; done
        echo "### 已发布 $V" >> "$GITHUB_STEP_SUMMARY"
        echo "- $A:$V" >> "$GITHUB_STEP_SUMMARY"
        echo "- $B:$V" >> "$GITHUB_STEP_SUMMARY"
    - name: Verify anonymous pull + live data smoke
      run: |
        OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')
        docker logout ghcr.io
        docker image rm -f ghcr.io/$OWNER/kline-analysis-api:nas ghcr.io/$OWNER/kline-bff:nas >/dev/null
        if docker pull -q ghcr.io/$OWNER/kline-analysis-api:nas && docker pull -q ghcr.io/$OWNER/kline-bff:nas; then
          echo "- 匿名拉取：OK（公开镜像）" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- 匿名拉取：失败（镜像为私有，需要在 GitHub Packages 设置为 Public）" >> "$GITHUB_STEP_SUMMARY"; exit 1
        fi
        TOKEN=$(openssl rand -hex 32)
        docker run -d --name a -p 8000:8000 -e ANALYSIS_API_TOKEN=$TOKEN -e MARKET_DATA_PROVIDER=live ghcr.io/$OWNER/kline-analysis-api:nas
        for i in $(seq 1 30); do curl -fsS localhost:8000/healthz >/dev/null && break; sleep 2; done
        for c in 002436 603068 688432; do
          curl -sS -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "{\"code\":\"$c\"}" localhost:8000/api/v1/analyses \
            | python3 -c "import json,sys; d=json.load(sys.stdin); a=d.get('analysis'); print('$c', 'OK' if a else 'ERR', (a['as_of'], a['input']['bar_count'], a['input']['provenance'].get('source')) if a else d.get('error'))" | tee -a "$GITHUB_STEP_SUMMARY"
        done
        curl -sS -H "Authorization: Bearer $TOKEN" localhost:8000/api/v1/market | python3 -c "import json,sys; d=json.load(sys.stdin); m=(d.get('market_env') or {}); print('market', m.get('as_of'), m.get('stage'), m.get('price'))" | tee -a "$GITHUB_STEP_SUMMARY"
        docker logs a 2>&1 | tail -20
