name: Kline Pattern Analyzer CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**', 'paios/**', 'v5/**', 'v6/**' ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib pytest

    - name: Python syntax check
      run: |
        python -m py_compile core/pivots.py
        python -m py_compile core/types.py
        python -m py_compile core/interfaces.py
        python -m py_compile core/registry.py
        python -m py_compile core/sector_validation/pipeline.py
        python -m py_compile scripts/refresh_sector_membership.py
        python -m py_compile skill/scripts/analyze_stock.py
        python -m py_compile skill/scripts/pattern_scanner.py
        python -m py_compile skill/scripts/batch_scan.py
        echo "Python syntax OK"

    - name: Run V5 Canonical Core tests (FIR-14)
      run: |
        python -m pytest tests/v5/ -v --tb=short
        echo "V5 Canonical Core tests passed"

    - name: Run pipeline fidelity tests (JSON == direct V5 core output)
      run: |
        python -m pytest tests/pipeline/ -v --tb=short

    - name: Run FIR-25 exchange calendar provenance verifier
      run: |
        python tests/v5/verify_fir25_provenance_sample.py
        echo "FIR-25 provenance derivation checks passed (provider live check skipped in CI)"

    - name: Run V5 Canonical Schema Cross-Runtime Parity (JS↔Python)
      run: |
        cd tests/v5
        python run_canonical_parity.py
        echo "Canonical schema cross-runtime parity passed (100%)"

    - name: Run V5 canonical swing-pivot tests (PAIOS PILOT-001)
      run: |
        python tests/test_pivots.py

    - name: Run Batch 1 regression tests
      run: |
        cd tests
        python test_batch1_regression.py

    - name: Run Batch 2-4 regression tests
      run: |
        cd tests
        python test_batch2_4_regression.py

    - name: Run JS/Python parity fixtures (#22)
      run: |
        cd tests
        python run_parity_tests.py --output /tmp/parity_results.json
        python -c "
        import json
        with open('/tmp/parity_results.json') as f:
            data = json.load(f)
        results = data['results']
        print(f'Parity fixtures: {len(results)} groups')
        for r in results:
            if 'error' in r:
                print(f'  ERROR: {r[\"fixture_id\"]}: {r[\"error\"]}')
                exit(1)
            print(f'  OK: {r[\"fixture_id\"]} (data_length={r[\"data_length\"]})')
        print('All parity fixtures passed')
        "

    - name: Run sector data validation (#20/#21)
      run: |
        cd tests
        python validate_sector_data.py

    - name: Run FIR-15 sector membership validation
      run: |
        python scripts/refresh_sector_membership.py --validate-only

    - name: Run FIR-15 controlled authoritative reconciliation gate
      run: |
        rm -rf /tmp/fir15-provenance /tmp/fir15-evidence
        python scripts/refresh_sector_membership.py \
          --sector 创新药 \
          --reconcile-with-snapshot tests/v5/fixtures/fir15_innovation_drug_snapshot.json \
          --provenance-dir /tmp/fir15-provenance \
          --evidence-dir /tmp/fir15-evidence \
          --as-of "$(python -c "import json;print(json.load(open('tests/v5/fixtures/fir15_innovation_drug_snapshot.json'))['as_of_date'])")" \
          --json > /tmp/fir15_authoritative_report.json
        python - <<'PY'
        import json
        with open('/tmp/fir15_authoritative_report.json', encoding='utf-8') as f:
            data = json.load(f)
        summary = data['summary']
        report = data['reports']['创新药']
        assert summary['overall_verification_rate'] == 1.0, summary
        assert report['verified'] == report['total'] > 0, report
        assert report['unverified'] == 0, report
        assert data['freshness']['创新药'] == 'fresh', data['freshness']
        evidence = data['reconciliation_audit']['创新药']['evidence_path']
        assert evidence, data['reconciliation_audit']
        print(f"FIR-15 authoritative gate passed: {report['verified']}/{report['total']} VERIFIED; evidence={evidence}")
        PY

    - name: Run backtest horizon tests (BUG-013)
      run: |
        cd tests
        python test_backtest_horizons.py

  js-syntax-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: JS syntax check
      run: |
        node -e "
        const fs = require('fs');
        const html = fs.readFileSync('kline_analyzer.html', 'utf8');
        const scripts = html.match(/<script[^>]*>([\s\S]*?)<\/script>/g);
        let totalJS = '';
        scripts.forEach(s => { totalJS += s.replace(/<\/?script[^>]*>/g, '') + '\n'; });
        try { new Function(totalJS); console.log('JS syntax OK'); }
        catch(e) { console.error('JS syntax error:', e.message); process.exit(1); }
        "

    - name: Run FIR-19 multi-device sync regression tests
      run: |
        cd tests
        node test_fir19_sync.js

    - name: Run FIR-20 delete resurrection regression tests
      run: |
        cd tests
        node test_fir20_delete.js

    - name: Run FIR-28 release identity regression tests
      run: |
        node tests/test_fir28_release_identity.js

  analysis-api:
    # V6 Python 分析服务（FIR-31 / FIR-38）：契约、迁移、预置板块一致性
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install pinned dependencies
      run: pip install -r services/analysis_api/requirements-dev.txt
    - name: Preset sectors identical to V5 page
      run: python scripts/extract_preset_sectors.py --check
    - name: Analysis API tests
      run: cd services/analysis_api && python -m pytest tests -q -W ignore::DeprecationWarning

  bff-tests:
    # V6 Node BFF（鉴权 / CSRF / 限流 / 超时 / 转发）与静态网页资源
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install (lockfile)
      run: cd apps/bff && npm ci --no-audit --no-fund
    - name: BFF tests
      run: cd apps/bff && npm test
    - name: Pattern catalog identical to V5 page (FIR-13 claims removed)
      run: node scripts/extract_pattern_catalog.js --check
    - name: Web JS syntax
      run: for f in apps/web/js/*.js; do node --check "$f"; done
    - name: V5 界面（V6 引擎）JS syntax
      run: for f in apps/web-v5/js/*.js; do node --check "$f"; done

  e2e-web:
    # 真实浏览器（手机 + PC）：Core → Python API → BFF → 网页 逐字段一致（价格容差 1e-4）
    runs-on: ubuntu-latest
    needs: [analysis-api, bff-tests]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install
      run: |
        pip install -r services/analysis_api/requirements-dev.txt playwright==1.56.0
        python -m playwright install --with-deps chromium
        cd apps/bff && npm ci --no-audit --no-fund
    - name: E2E
      run: python -m pytest tests/e2e -q
    - name: Upload phone / PC evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-e2e-evidence
        path: docs/v6/evidence/

  docker-images:
    # 两个服务的镜像构建 + compose 冒烟（fixture 行情，内网 http + 服务凭证）
    runs-on: ubuntu-latest
    needs: [analysis-api, bff-tests]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build and start stack
      run: |
        HASH=$(printf '%s' 'ci-smoke-password-123' | node apps/bff/src/hash-password.js)
        cat > deploy/.env <<ENVEOF
        DEPLOY_ENV=staging
        RELEASE_VERSION=v6.0.0-rc.1
        RELEASE_COMMIT=${GITHUB_SHA}
        RELEASED_AT=$(date -u +%F)
        BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        ANALYSIS_API_TOKEN=$(openssl rand -hex 32)
        SESSION_SECRET=$(openssl rand -hex 32)
        LOGIN_USERNAME=owner
        LOGIN_PASSWORD_HASH='${HASH}'
        MARKET_DATA_PROVIDER=fixture
        COOKIE_SECURE=false
        ENVEOF
        sed -i 's/^ *//' deploy/.env
        sed -i 's/^DEPLOY_ENV=staging/DEPLOY_ENV=development/' deploy/.env
        docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
        for i in $(seq 1 60); do curl -fsS localhost:8080/readyz && break; sleep 2; done
    - name: Smoke test through BFF
      run: |
        curl -fsS localhost:8080/healthz
        curl -fsS localhost:8080/readyz
        curl -fsS -c cj -H 'content-type: application/json' -d '{"username":"owner","password":"ci-smoke-password-123"}' localhost:8080/auth/login > login.json
        CSRF=$(python3 -c "import json;print(json.load(open('login.json'))['csrf'])")
        curl -fsS -b cj -H 'content-type: application/json' -H "x-csrf-token: $CSRF" -d '{"code":"002436"}' localhost:8080/api/v1/analyses \
          | python3 -c "import json,sys; d=json.load(sys.stdin)['analysis']; assert d['input']['bar_count']==250 and len(d['core']['patterns'])==8; print('analysis ok', d['input']['data_hash'])"
        curl -fsS -b cj localhost:8080/api/v1/version | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['engine']['verified'] and d['compatibility']['ok'], d; print(d['engine']['version'], d['engine']['commit'])"
        test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/v1/watchlist)" = "401"
        docker compose -f deploy/docker-compose.yml --env-file deploy/.env ps
        docker image ls --digests | grep kline-v6 || docker image ls | grep kline
        {
          echo "### V6 镜像（commit ${GITHUB_SHA}）"
          echo '```'
          for img in $(docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --images); do
            echo "$img $(docker image inspect --format '{{.Id}}' "$img")"
          done
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Logs
      if: always()
      run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color | tail -200

  cross-runtime-parity:
    runs-on: ubuntu-latest
    needs: [python-tests, js-syntax-check]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib

    - name: Run Cross-Runtime Parity Gate (Python vs Node/JS)
      run: |
        cd tests
        python run_cross_parity.py
        python -c "
        import subprocess, sys
        result = subprocess.run([sys.executable, 'run_cross_parity.py'], capture_output=True, text=True)
        output = result.stdout
        for line in output.split('\n'):
            if '结果:' in line:
                print(line)
                parts = line.split(':')[1].strip().split('/')
                passed = int(parts[0])
                total = int(parts[1].split(' ')[0])
                if passed != total:
                    print(f'ERROR: pass rate {passed}/{total} != 100%')
                    sys.exit(1)
                print('Cross-runtime parity gate passed (100%)')
                break
        "

  file-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check critical files exist
      run: |
        test -f kline_analyzer.html || (echo "ERROR: kline_analyzer.html missing" && exit 1)
        test -f core/pivots.py || (echo "ERROR: core/pivots.py missing" && exit 1)
        test -f core/__init__.py || (echo "ERROR: core/__init__.py missing" && exit 1)
        test -f core/types.py || (echo "ERROR: core/types.py missing" && exit 1)
        test -f core/interfaces.py || (echo "ERROR: core/interfaces.py missing" && exit 1)
        test -f core/registry.py || (echo "ERROR: core/registry.py missing" && exit 1)
        test -f core/sector_validation/pipeline.py || (echo "ERROR: FIR-15 pipeline missing" && exit 1)
        test -f tests/v5/fixtures/fir15_innovation_drug_snapshot.json || (echo "ERROR: FIR-15 snapshot fixture missing" && exit 1)
        test -f tests/v5/__init__.py || (echo "ERROR: tests/v5/__init__.py missing" && exit 1)
        test -f tests/v5/conftest.py || (echo "ERROR: tests/v5/conftest.py missing" && exit 1)
        test -f tests/v5/test_types.py || (echo "ERROR: tests/v5/test_types.py missing" && exit 1)
        test -f tests/v5/test_interfaces.py || (echo "ERROR: tests/v5/test_interfaces.py missing" && exit 1)
        test -f tests/v5/test_registry.py || (echo "ERROR: tests/v5/test_registry.py missing" && exit 1)
        test -f tests/v5/test_contract.py || (echo "ERROR: tests/v5/test_contract.py missing" && exit 1)
        test -f tests/v5/test_backwards_compat.py || (echo "ERROR: tests/v5/test_backwards_compat.py missing" && exit 1)
        test -f tests/v5/test_backtest_result.py || (echo "ERROR: tests/v5/test_backtest_result.py missing" && exit 1)
        test -f tests/test_pivots.py || (echo "ERROR: tests/test_pivots.py missing" && exit 1)
        test -f skill/scripts/analyze_stock.py || (echo "ERROR: analyze_stock.py missing" && exit 1)
        test -f skill/scripts/pattern_scanner.py || (echo "ERROR: pattern_scanner.py missing" && exit 1)
        test -f skill/scripts/batch_scan.py || (echo "ERROR: batch_scan.py missing" && exit 1)
        test -f tests/test_batch1_regression.py || (echo "ERROR: test_batch1_regression.py missing" && exit 1)
        test -f tests/test_batch2_4_regression.py || (echo "ERROR: test_batch2_4_regression.py missing" && exit 1)
        echo "All critical files present"

    - name: Check HTML file size (prevent accidental deletion)
      run: |
        SIZE=$(wc -c < kline_analyzer.html)
        echo "kline_analyzer.html size: $SIZE bytes"
        if [ "$SIZE" -lt 100000 ]; then
          echo "ERROR: kline_analyzer.html too small ($SIZE bytes), possible deletion"
          exit 1
        fi
        echo "HTML file size OK"
