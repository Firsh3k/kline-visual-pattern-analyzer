<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K线形态分析工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1419; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a2332, #0f1419); padding: 16px 24px; border-bottom: 1px solid #2a3441; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 20px; color: #f0f0f0; }
.header h1 span { color: #e74c3c; }
.tabs { display: flex; gap: 4px; }
.tab { padding: 8px 20px; cursor: pointer; border-radius: 6px; font-size: 14px; transition: all 0.2s; border: none; background: transparent; color: #8899aa; }
.tab.active { background: #e74c3c; color: #fff; }
.tab:hover:not(.active) { background: #1e2836; color: #ccc; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.page { display: none; }
.page.active { display: block; }

/* 图形库 */
.pattern-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.pattern-card { background: #1a2332; border-radius: 10px; padding: 20px; border: 1px solid #2a3441; cursor: pointer; transition: all 0.2s; }
.pattern-card:hover { border-color: #e74c3c; transform: translateY(-2px); }
.pattern-card h3 { font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.reliability { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #27ae60; color: #fff; }
.pattern-card svg { width: 100%; height: 120px; margin: 10px 0; }
.pattern-card p { font-size: 13px; color: #8899aa; line-height: 1.6; }
.pattern-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a3441; }
.pattern-card.expanded .pattern-detail { display: block; }
.pattern-detail h4 { font-size: 13px; color: #e74c3c; margin: 8px 0 4px; }
.pattern-detail ul { font-size: 13px; color: #aabbcc; padding-left: 18px; line-height: 1.8; }

/* 分析页 */
.search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search-bar input { flex: 1; min-width: 200px; padding: 10px 16px; border-radius: 8px; border: 1px solid #2a3441; background: #1a2332; color: #e0e0e0; font-size: 15px; outline: none; }
.search-bar input:focus { border-color: #e74c3c; }
.search-bar button { padding: 10px 24px; border-radius: 8px; border: none; background: #e74c3c; color: #fff; font-size: 15px; cursor: pointer; transition: background 0.2s; }
.search-bar button:hover { background: #c0392b; }
.search-bar button:disabled { background: #555; cursor: not-allowed; }
.quick-codes { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.quick-code { padding: 6px 14px; border-radius: 6px; background: #1a2332; border: 1px solid #2a3441; color: #8899aa; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.quick-code:hover { border-color: #e74c3c; color: #e0e0e0; }
.stock-info { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.stock-info .name { font-size: 22px; font-weight: 600; }
.stock-info .code { font-size: 16px; color: #8899aa; }
.stock-info .price { font-size: 28px; font-weight: 700; }
.stock-info .change { font-size: 16px; font-weight: 600; }
.up { color: #e74c3c; }
.down { color: #2ecc71; }
.chart-section { background: #1a2332; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a3441; }
.chart-section h3 { font-size: 15px; margin-bottom: 10px; color: #aabbcc; }
canvas { width: 100%; display: block; }
.analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.analysis-card { background: #1a2332; border-radius: 10px; padding: 16px; border: 1px solid #2a3441; }
.analysis-card h3 { font-size: 15px; margin-bottom: 12px; color: #aabbcc; border-bottom: 1px solid #2a3441; padding-bottom: 8px; }
.match-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.match-item .label { width: 100px; font-size: 13px; color: #aabbcc; }
.match-item .bar-bg { flex: 1; height: 20px; background: #0f1419; border-radius: 4px; overflow: hidden; }
.match-item .bar { height: 100%; border-radius: 4px; transition: width 0.5s; }
.match-item .pct { width: 45px; text-align: right; font-size: 13px; font-weight: 600; }
.verdict { padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; line-height: 1.7; }
.verdict strong { color: #e74c3c; }
.level-list { font-size: 13px; line-height: 2; }
.level-list .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #2a3441; }
.volume-info { font-size: 13px; line-height: 2; color: #aabbcc; }
.volume-info .row { display: flex; justify-content: space-between; }
.loading { text-align: center; padding: 60px 20px; color: #8899aa; }
.loading .spinner { width: 40px; height: 40px; border: 3px solid #2a3441; border-top-color: #e74c3c; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: #2c1810; border: 1px solid #e74c3c; color: #e74c3c; padding: 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
.csv-upload { margin-top: 10px; }
.csv-upload label { display: inline-block; padding: 8px 16px; background: #2a3441; border-radius: 6px; cursor: pointer; font-size: 13px; color: #aabbcc; transition: background 0.2s; }
.csv-upload label:hover { background: #3a4451; }
.csv-upload input { display: none; }
.footer { text-align: center; padding: 20px; color: #556677; font-size: 12px; line-height: 1.8; }
.legend { display: flex; gap: 16px; font-size: 12px; color: #8899aa; margin-bottom: 8px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend i { width: 12px; height: 3px; display: inline-block; border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>K线形态分析工具 <span>·</span> 上升找买点 + 下降找卖点</h1>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('patterns')">典型图形库</button>
    <button class="tab" onclick="switchTab('analyze')">股票分析</button>
    <button class="tab" onclick="switchTab('watchlist')">自选股池</button>
    <button class="tab" onclick="switchTab('scanner')">市场扫描</button>
  </div>
</div>

<div class="container">
  <!-- 典型图形库 -->
  <div id="page-patterns" class="page active">
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="pattern-tab active" onclick="switchPatternType('bull')" style="padding:8px 20px;border-radius:6px;border:none;cursor:pointer;background:#e74c3c;color:#fff;font-size:14px;">上升形态（找买点）</button>
      <button class="pattern-tab" onclick="switchPatternType('bear')" style="padding:8px 20px;border-radius:6px;border:none;cursor:pointer;background:#1a2332;color:#8899aa;font-size:14px;">下降形态（找卖点）</button>
    </div>
    <div class="pattern-grid" id="patternGrid"></div>
  </div>

  <!-- 股票分析 -->
  <div id="page-analyze" class="page">
    <div class="search-bar">
      <input type="text" id="codeInput" placeholder="输入股票代码，如 002436、600519" maxlength="6" onkeydown="if(event.key==='Enter')doAnalyze()">
      <button onclick="doAnalyze()" id="analyzeBtn">开始分析</button>
    </div>
    <div class="quick-codes">
      <span class="quick-code" onclick="quickAnalyze('002436')">兴森科技 002436</span>
      <span class="quick-code" onclick="quickAnalyze('600519')">贵州茅台 600519</span>
      <span class="quick-code" onclick="quickAnalyze('002594')">比亚迪 002594</span>
      <span class="quick-code" onclick="quickAnalyze('300750')">宁德时代 300750</span>
    </div>
    <div id="resultArea"></div>
  </div>

  <!-- 自选股池 -->
  <div id="page-watchlist" class="page">
    <div style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
        <h3 style="margin:0;">我的自选股池</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button onclick="analyzeAllWatchlist()" style="padding:8px 20px;background:#e74c3c;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;">分析全部</button>
          <button onclick="clearAllWatchlist()" style="padding:8px 16px;background:#1a2332;color:#8899aa;border:1px solid #2a3441;border-radius:6px;font-size:13px;cursor:pointer;">清空全部</button>
        </div>
      </div>
      <p style="font-size:13px;color:#8899aa;margin-bottom:12px;">自选股自动保存在本地，下次打开自动加载。添加股票后自动分析，双击行可在新标签页查看详情。</p>
      
      <!-- 添加股票 -->
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <input type="text" id="addStockInput" placeholder="输入6位股票代码，如 002436" style="flex:1;min-width:200px;background:#0f1419;border:1px solid #2a3441;border-radius:6px;color:#f0f0f0;padding:10px 12px;font-size:14px;" onkeypress="if(event.key==='Enter')addStock()">
        <button onclick="addStock()" style="padding:10px 20px;background:#3498db;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;">添加</button>
        <button onclick="loadExampleWatchlist()" style="padding:10px 16px;background:#1a2332;color:#8899aa;border:1px solid #2a3441;border-radius:6px;font-size:14px;cursor:pointer;">加载示例</button>
      </div>
      
      <!-- 自选股标签列表 -->
      <div id="watchlistTags" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:32px;"></div>
      
      <span id="batchStatus" style="font-size:13px;color:#8899aa;"></span>
    </div>
    <div id="batchResults"></div>
  </div>

  <!-- 市场扫描 -->
  <div id="page-scanner" class="page">
    <div style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
        <h3 style="margin:0;">市场扫描</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <label style="font-size:13px;color:#8899aa;">信号类型:</label>
          <select id="scanSignalType" style="background:#0f1419;border:1px solid #2a3441;border-radius:6px;color:#f0f0f0;padding:6px 10px;font-size:13px;">
            <option value="bull" selected>仅底部信号（上升趋势）</option>
            <option value="bear">仅顶部信号（下降趋势）</option>
            <option value="all">全部信号</option>
          </select>
          <label style="font-size:13px;color:#8899aa;">最低推荐度:</label>
          <select id="scanMinScore" style="background:#0f1419;border:1px solid #2a3441;border-radius:6px;color:#f0f0f0;padding:6px 10px;font-size:13px;">
            <option value="0">全部</option>
            <option value="50">≥50分</option>
            <option value="60" selected>≥60分</option>
            <option value="70">≥70分</option>
            <option value="80">≥80分</option>
          </select>
          <button onclick="startMarketScan()" style="padding:8px 20px;background:#e74c3c;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;">开始扫描</button>
          <button onclick="addSelectedToWatchlist()" style="padding:8px 16px;background:#3498db;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;">加入自选股</button>
        </div>
      </div>
      <p style="font-size:13px;color:#8899aa;margin-bottom:12px;">选择板块范围，扫描符合上升/下降形态的个股。勾选结果可批量加入自选股池。</p>
      
      <!-- 板块选择 -->
      <div style="margin-bottom:12px;">
        <div style="font-size:13px;color:#8899aa;margin-bottom:8px;">选择扫描范围（可多选）：</div>
        <div id="sectorList" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
      
      <!-- 自定义板块 -->
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <input type="text" id="customSectorName" placeholder="自定义板块名称" style="width:140px;background:#0f1419;border:1px solid #2a3441;border-radius:6px;color:#f0f0f0;padding:8px 10px;font-size:13px;">
        <input type="text" id="customSectorCodes" placeholder="股票代码，逗号分隔" style="flex:1;min-width:200px;background:#0f1419;border:1px solid #2a3441;border-radius:6px;color:#f0f0f0;padding:8px 10px;font-size:13px;">
        <button onclick="addCustomSector()" style="padding:8px 16px;background:#1a2332;color:#8899aa;border:1px solid #2a3441;border-radius:6px;font-size:13px;cursor:pointer;">添加板块</button>
      </div>
      
      <span id="scanStatus" style="font-size:13px;color:#8899aa;"></span>
      <div id="scanProgress" style="margin-top:8px;height:6px;background:#1a2332;border-radius:3px;overflow:hidden;display:none;">
        <div id="scanProgressBar" style="height:100%;background:#e74c3c;width:0%;transition:width 0.3s;"></div>
      </div>
    </div>
    <div id="scanResults"></div>
  </div>
</div>

<div class="footer">
  数据来源：新浪财经公开接口（前复权日线） | 本工具基于技术形态量化分析，仅供学习参考，不构成投资建议<br>
  股市有风险，投资需谨慎
</div>

<script>
// ============ 4种典型形态定义 ============
const PATTERNS = [
  {
    id: 'ma_bull', name: '均线多头排列', reliability: '高', reliability_pct: 78, sample_note: '经典趋势跟踪形态，历史样本充足，牛市中成功率可达85%+，震荡市约65%',
    desc: 'MA5 > MA10 > MA20 > MA60，股价沿均线稳步爬升，回调不破均线。',
    features: ['短期均线在上，长期均线在下，呈发散状', '股价沿MA5或MA10上行，很少跌破MA20', '均线呈向上的扇形排列'],
    volume: '上涨时放量，回调时缩量，量价配合健康',
    action: '持股待涨，回踩MA10或MA20不破时加仓，跌破MA20减仓'
  },
  {
    id: 'w_bottom', name: 'W底/双底', reliability: '高', reliability_pct: 82, sample_note: '经典底部反转形态，右底高于左底+放量突破颈线时可靠性最高，历史回测成功率约82%',
    desc: '股价两次探底，第二个低点不低于第一个低点，放量突破颈线。',
    features: ['两个低点，第二个低点等于或高于第一个', '两次探底之间有一个反弹高点（颈线位）', '突破颈线时成交量明显放大'],
    volume: '第一个底放量下跌，第二个底缩量，突破颈线时放量',
    action: '突破颈线时买入，回踩颈线不破加仓，跌破颈线止损'
  },
  {
    id: 'hs_bottom', name: '头肩底', reliability: '高', reliability_pct: 85, sample_note: '可靠性最高的底部反转形态，右肩高于头部+放量突破颈线时成功率可达85%+，最小涨幅可测算',
    desc: '左肩-头部-右肩三个低点，头部最低，右肩高于左肩，突破颈线。',
    features: ['三个低点：左肩、头部（最低）、右肩', '右肩低点高于左肩低点', '颈线连接两次反弹高点，突破时放量'],
    volume: '头部缩量最明显，右肩缩量，突破颈线放量',
    action: '突破颈线时买入，回踩颈线确认加仓，最小涨幅=头部到颈线距离'
  },
  {
    id: 'platform_break', name: '平台突破', reliability: '高', reliability_pct: 80, sample_note: '"横有多长竖有多高"，平台整理20日以上+放量突破上沿时可靠性约80%，假突破约占20%',
    desc: '长期横盘整理后放量突破平台上沿，开启新一波上涨。',
    features: ['股价在一个窄幅区间内横盘整理（通常20日以上）', '横盘期间振幅收窄，均线粘合', '突破平台上沿时放量（量能>5日均量1.5倍）'],
    volume: '横盘期间缩量，突破日放量，突破后缩量回踩不破平台',
    action: '突破日买入，回踩平台上沿不破加仓，跌破平台止损'
  }
];

// ============ 4种下降形态定义 ============
const BEAR_PATTERNS = [
  {
    id: 'ma_bear', name: '均线空头排列', reliability: '高', reliability_pct: 80, sample_note: '经典下跌趋势形态，均线空头排列后继续下跌概率约80%，抄底胜率极低',
    desc: 'MA5 < MA10 < MA20 < MA60，股价沿均线稳步下行，反弹不破均线。',
    features: ['短期均线在下，长期均线在上，呈向下发散状', '股价沿MA5或MA10下行，很少突破MA20', '均线呈向下的扇形排列'],
    volume: '下跌时放量，反弹时缩量',
    action: '止损离场，不要抄底，等待均线扭转'
  },
  {
    id: 'm_top', name: 'M头/双头', reliability: '高', reliability_pct: 83, sample_note: '经典顶部反转形态，右头低于左头+放量跌破颈线时可靠性约83%，最小跌幅可测算',
    desc: '股价两次冲高，第二个高点不高于第一个高点，放量跌破颈线。',
    features: ['两个高点，第二个高点等于或低于第一个', '两次冲高之间有一个回调低点（颈线位）', '跌破颈线时成交量明显放大'],
    volume: '第一个头放量，第二个头缩量，跌破颈线放量',
    action: '跌破颈线时止损，最小跌幅=头部到颈线距离'
  },
  {
    id: 'hs_top', name: '头肩顶', reliability: '高', reliability_pct: 86, sample_note: '可靠性最高的顶部反转形态，右肩低于头部+放量跌破颈线时成功率可达86%+，是最重要的止盈信号',
    desc: '左肩-头部-右肩三个高点，头部最高，右肩低于左肩，跌破颈线。',
    features: ['三个高点：左肩、头部（最高）、右肩', '右肩高点低于左肩高点', '颈线连接两次回调低点，跌破时放量'],
    volume: '头部放量最明显，右肩缩量，跌破颈线放量',
    action: '跌破颈线时止损，最小跌幅=头部到颈线距离'
  },
  {
    id: 'platform_break_down', name: '平台破位', reliability: '高', reliability_pct: 81, sample_note: '"横有多长跌有多深"，平台整理后放量跌破下沿时可靠性约81%，破位后下跌空间大',
    desc: '长期横盘整理后放量跌破平台下沿，开启新一波下跌。',
    features: ['股价在窄幅区间横盘整理（通常20日以上）', '横盘期间振幅收窄，均线粘合', '跌破平台下沿时放量（量能>5日均量1.5倍）'],
    volume: '横盘期间缩量，破位日放量，跌破后反弹不过平台',
    action: '破位日立即止损，不要抱有幻想'
  }
];

// ============ 渲染图形库 ============
let currentPatternType = 'bull';
function renderPatterns() {
  const grid = document.getElementById('patternGrid');
  const list = currentPatternType === 'bull' ? PATTERNS : BEAR_PATTERNS;
  grid.innerHTML = list.map((p, i) => `
    <div class="pattern-card" onclick="this.classList.toggle('expanded')">
      <h3>${p.name} <span class="reliability" style="background:${p.type==='bear'?'#2ecc71':'#27ae60'}">可靠性：${p.reliability}</span></h3>
      ${getPatternSVG(p.id)}
      <p>${p.desc}</p>
      <div class="pattern-detail">
        <h4>形态特征</h4>
        <ul>${p.features.map(f => `<li>${f}</li>`).join('')}</ul>
        <h4>量价配合</h4>
        <ul><li>${p.volume}</li></ul>
        <h4>操作建议</h4>
        <ul><li>${p.action}</li></ul>
      </div>
    </div>
  `).join('');
}

function switchPatternType(type) {
  currentPatternType = type;
  document.querySelectorAll('.pattern-tab').forEach((btn, i) => {
    const isActive = (type === 'bull' && i === 0) || (type === 'bear' && i === 1);

// ============ 数据获取 ============
async function fetchKline(code) {
  const market = code.startsWith('6') ? 'sh' : 'sz';
  const symbol = market + code;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    // 主数据源：新浪财经（JSONP方式，绕过CORS）
    try {
      const data = await fetchSinaKlineJSONP(symbol);
      if (data && data.length > 0) {
        const name = await fetchStockNameJSONP(symbol);
        return { name: name || code, code, data };
      }
    } catch(e) { console.warn('新浪JSONP失败，尝试备用源', e); }

    // 备用数据源：腾讯财经
    const txUrl = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${symbol},day,,,250,qfq`;
    const resp = await fetch(txUrl, { signal: controller.signal });
    const json = await resp.json();
    const sd = json.data?.[symbol];
    if (!sd) throw new Error('未找到该股票数据');
    const rows = sd.qfqday || sd.day || [];
    const name = sd.qt?.[symbol]?.[1] || code;
    const data = rows.map(r => ({
      date: r[0], open: parseFloat(r[1]), close: parseFloat(r[2]),
      high: parseFloat(r[3]), low: parseFloat(r[4]), volume: parseFloat(r[5])
    }));
    data.sort((a, b) => a.date.localeCompare(b.date));
    return { name, code, data };
  } finally {
    clearTimeout(timeout);
  }
}

// 新浪K线数据（JSONP方式）
function fetchSinaKlineJSONP(symbol) {
  return new Promise((resolve, reject) => {
    const callbackName = '_sina_kline_' + Date.now();
    const url = `https://quotes.sina.cn/cn/api/jsonp_v2.php/${callbackName}/CN_MarketDataService.getKLineData?symbol=${symbol}&scale=240&ma=no&datalen=250`;
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('新浪接口超时'));
    }, 10000);
    function cleanup() {
      clearTimeout(timer);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = function(rows) {
      cleanup();
      if (!rows || !Array.isArray(rows) || rows.length === 0) {
        reject(new Error('新浪数据为空'));
        return;
      }
      const data = rows.map(r => ({
        date: r.day, open: parseFloat(r.open), close: parseFloat(r.close),
        high: parseFloat(r.high), low: parseFloat(r.low), volume: parseFloat(r.volume)
      }));
      data.sort((a, b) => a.date.localeCompare(b.date));
      resolve(data);
    };
    script.onerror = () => { cleanup(); reject(new Error('新浪接口加载失败')); };
    script.src = url;
    document.head.appendChild(script);
  });
}

// 获取股票名称（腾讯实时行情接口，GBK编码，用script标签加载）
function fetchStockNameJSONP(symbol) {
  return new Promise((resolve) => {
    const varName = 'v_' + symbol;
    const url = `https://qt.gtimg.cn/q=${symbol}`;
    const script = document.createElement('script');
    script.charset = 'gbk'; // 腾讯接口返回GBK编码
    const timer = setTimeout(() => { cleanup(); resolve(null); }, 5000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[varName]; } catch(e) { window[varName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    script.onload = () => {
      try {
        const val = window[varName];
        if (val && typeof val === 'string') {
          const parts = val.split('~');
          if (parts.length > 1 && parts[1]) {
            cleanup();
            resolve(parts[1]);
            return;
          }
        }
      } catch(e) {}
      cleanup();
      resolve(null);
    };
    script.onerror = () => { cleanup(); resolve(null); };
    script.src = url;
    document.head.appendChild(script);
  });
}

// ============ 技术指标计算 ============
function calcMA(data, n) {
  return data.map((_, i) => {
    if (i < n - 1) return null;
    let sum = 0;
    for (let j = i - n + 1; j <= i; j++) sum += data[j].close;
    return sum / n;
  });
}

function calcIndicators(data) {
  const ma5 = calcMA(data, 5), ma10 = calcMA(data, 10), ma20 = calcMA(data, 20), ma60 = calcMA(data, 60);
  const vma5 = calcMA(data.map(d => ({close: d.volume})), 5);
  const vma20 = calcMA(data.map(d => ({close: d.volume})), 20);
  // MACD
  const ema12 = [], ema26 = [], dif = [], dea = [], macd = [];
  let e12 = data[0].close, e26 = data[0].close;
  for (let i = 0; i < data.length; i++) {
    e12 = i === 0 ? data[0].close : e12 * 11/13 + data[i].close * 2/13;
    e26 = i === 0 ? data[0].close : e26 * 25/27 + data[i].close * 2/27;
    ema12.push(e12); ema26.push(e26);
    dif.push(e12 - e26);
    dea.push(i === 0 ? dif[0] : dea[i-1] * 8/10 + dif[i] * 2/10);
    macd.push((dif[i] - dea[i]) * 2);
  }
  // RSI (14日)
  const rsi = [];
  for (let i = 0; i < data.length; i++) {
    if (i < 14) { rsi.push(50); continue; }
    let gains = 0, losses = 0;
    for (let j = i - 13; j <= i; j++) {
      const change = data[j].close - data[j-1].close;
      if (change > 0) gains += change; else losses -= change;
    }
    const avgGain = gains / 14, avgLoss = losses / 14;
    rsi.push(avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss));
  }
  // KDJ (9,3,3)
  const kdj_k = [], kdj_d = [], kdj_j = [];
  let prevK = 50, prevD = 50;
  for (let i = 0; i < data.length; i++) {
    if (i < 8) { kdj_k.push(50); kdj_d.push(50); kdj_j.push(50); continue; }
    const slice9 = data.slice(i - 8, i + 1);
    const high9 = Math.max(...slice9.map(d => d.high));
    const low9 = Math.min(...slice9.map(d => d.low));
    const rsv = high9 === low9 ? 50 : (data[i].close - low9) / (high9 - low9) * 100;
    const k = prevK * 2/3 + rsv * 1/3;
    const d = prevD * 2/3 + k * 1/3;
    const j = 3 * k - 2 * d;
    kdj_k.push(k); kdj_d.push(d); kdj_j.push(j);
    prevK = k; prevD = d;
  }
  // BOLL (20, 2)
  const boll_mid = [], boll_up = [], boll_low = [], boll_width = [];
  for (let i = 0; i < data.length; i++) {
    if (i < 19) { boll_mid.push(data[i].close); boll_up.push(data[i].close); boll_low.push(data[i].close); boll_width.push(0); continue; }
    const slice20 = data.slice(i - 19, i + 1).map(d => d.close);
    const mid = slice20.reduce((a,b) => a+b, 0) / 20;
    const variance = slice20.reduce((a,b) => a + (b-mid)**2, 0) / 20;
    const std = Math.sqrt(variance);
    boll_mid.push(mid); boll_up.push(mid + 2*std); boll_low.push(mid - 2*std);
    boll_width.push(mid > 0 ? (boll_up[i] - boll_low[i]) / mid * 100 : 0);
  }
  // ATR (14日)
  const atr = [];
  for (let i = 0; i < data.length; i++) {
    if (i === 0) { atr.push(data[i].high - data[i].low); continue; }
    const tr = Math.max(
      data[i].high - data[i].low,
      Math.abs(data[i].high - data[i-1].close),
      Math.abs(data[i].low - data[i-1].close)
    );
    if (i < 14) { atr.push(tr); } else {
      atr.push((atr[i-1] * 13 + tr) / 14);
    }
  }
  return { ma5, ma10, ma20, ma60, vma5, vma20, dif, dea, macd, rsi, kdj_k, kdj_d, kdj_j, boll_mid, boll_up, boll_low, boll_width, atr };
}

// ============ 增强信号检测 ============
// 1. MACD背离检测
function detectMACDDivergence(data, ind) {
  const n = data.length;
  const last = n - 1;
  const result = { topDivergence: 0, bottomDivergence: 0, topPoints: [], bottomPoints: [], detail: '' };
  if (n < 60) return result;

  // 找最近的两个显著高点（间隔至少10天）
  const lookback = Math.min(120, n - 1);
  const seg = data.slice(n - lookback);
  const highs = seg.map(d => d.high);
  const lows = seg.map(d => d.low);

  // 找高点
  const highPoints = [];
  for (let i = 5; i < highs.length - 5; i++) {
    if (highs[i] === Math.max(...highs.slice(i-5, i+6))) {
      highPoints.push({ idx: n - lookback + i, price: highs[i], dif: ind.dif[n - lookback + i], macd: ind.macd[n - lookback + i] });
    }
  }
  // 找低点
  const lowPoints = [];
  for (let i = 5; i < lows.length - 5; i++) {
    if (lows[i] === Math.min(...lows.slice(i-5, i+6))) {
      lowPoints.push({ idx: n - lookback + i, price: lows[i], dif: ind.dif[n - lookback + i], macd: ind.macd[n - lookback + i] });
    }
  }

  // 顶背离：后一个高点价格更高，但DIF或MACD更低
  if (highPoints.length >= 2) {
    const h1 = highPoints[highPoints.length - 2];
    const h2 = highPoints[highPoints.length - 1];
    if (h2.price > h1.price * 1.01 && (h2.dif < h1.dif || h2.macd < h1.macd)) {
      const strength = Math.min(100, Math.round((h2.price - h1.price) / h1.price * 500 + (h1.dif - h2.dif) / Math.abs(h1.dif) * 30));
      result.topDivergence = Math.max(30, strength);
      result.topPoints = [h1, h2];
      result.detail = `顶背离：${h1.idx}高点${h1.price.toFixed(2)} → ${h2.idx}高点${h2.price.toFixed(2)}，价格新高但MACD未新高`;
    }
  }

  // 底背离：后一个低点价格更低，但DIF或MACD更高
  if (lowPoints.length >= 2) {
    const l1 = lowPoints[lowPoints.length - 2];
    const l2 = lowPoints[lowPoints.length - 1];
    if (l2.price < l1.price * 0.99 && (l2.dif > l1.dif || l2.macd > l1.macd)) {
      const strength = Math.min(100, Math.round((l1.price - l2.price) / l1.price * 500 + (l2.dif - l1.dif) / Math.abs(l1.dif) * 30));
      result.bottomDivergence = Math.max(30, strength);
      result.bottomPoints = [l1, l2];
      result.detail = result.detail || `底背离：${l1.idx}低点${l1.price.toFixed(2)} → ${l2.idx}低点${l2.price.toFixed(2)}，价格新低但MACD未新低`;
    }
  }

  return result;
}

// 2. 量价背离检测
function detectVolumeDivergence(data, ind) {
  const n = data.length;
  const last = n - 1;
  const result = { topVolumeDivergence: 0, bottomVolumeDivergence: 0, volumeStagnation: 0, shrinkStop: 0, detail: '' };
  if (n < 30) return result;

  const curPrice = data[last].close;
  const curVol = data[last].volume;
  const v5 = ind.vma5[last] || 0;
  const v20 = ind.vma20[last] || 0;

  // 近20天最高价和最低价
  const recent20 = data.slice(n - 20);
  const high20 = Math.max(...recent20.map(d => d.high));
  const low20 = Math.min(...recent20.map(d => d.low));
  const isNearHigh = curPrice > high20 * 0.97;
  const isNearLow = curPrice < low20 * 1.03;

  // 顶部量价背离：价格在高位，但5日均量持续低于20日均量
  if (isNearHigh && v5 < v20 * 0.9) {
    result.topVolumeDivergence = Math.round((1 - v5/v20) * 150);
    result.detail = `顶部量价背离：价格接近20日新高，但5日均量仅为20日均量的${(v5/v20*100).toFixed(0)}%，买盘不足`;
  }

  // 底部量价背离：价格在低位，成交量持续萎缩
  if (isNearLow && v5 < v20 * 0.85) {
    result.bottomVolumeDivergence = Math.round((1 - v5/v20) * 150);
    result.detail = result.detail || `底部量价背离：价格接近20日新低，5日均量仅为20日均量的${(v5/v20*100).toFixed(0)}%，抛盘枯竭`;
  }

  // 放量滞涨：高位放量但价格不涨
  if (isNearHigh && v5 > v20 * 1.3) {
    const priceChange = (data[last].close - data[n-6].close) / data[n-6].close;
    if (priceChange < 0.02) {
      result.volumeStagnation = 60;
      result.detail = result.detail || `放量滞涨：高位放量（5日均量为20日的${(v5/v20*100).toFixed(0)}%）但近5日涨幅仅${(priceChange*100).toFixed(1)}%，主力可能出货`;
    }
  }

  // 缩量止跌：低位缩量价格不再下跌
  if (isNearLow && v5 < v20 * 0.8) {
    const priceChange = (data[last].close - data[n-6].close) / data[n-6].close;
    if (priceChange > -0.02) {
      result.shrinkStop = 55;
      result.detail = result.detail || `缩量止跌：低位缩量（5日均量为20日的${(v5/v20*100).toFixed(0)}%）且近5日不再下跌，可能见底`;
    }
  }

  return result;
}

// 3. 颈线确认度
function calcNecklineConfirm(data, bestDetail, isBear) {
  const n = data.length;
  const last = n - 1;
  const result = { confirmed: false, daysAbove: 0, volumeRatio: 1, pullbackTest: false, score: 0, detail: '' };

  // 从markers中找颈线价格
  let neckline = null;
  if (bestDetail.markers && bestDetail.markers.lines) {
    for (const line of bestDetail.markers.lines) {
      if (line.label && (line.label.includes('颈线') || line.label.includes('平台'))) {
        neckline = line.price;
        break;
      }
    }
  }
  if (!neckline) return result;

  const curPrice = data[last].close;
  // 上升形态：价格在颈线上方
  // 下降形态：价格在颈线下方
  const aboveNeckline = !isBear ? curPrice > neckline : curPrice < neckline;

  // 计算连续在颈线一侧的天数
  let days = 0;
  for (let i = last; i >= Math.max(0, last - 10); i--) {
    const cond = !isBear ? data[i].close > neckline : data[i].close < neckline;
    if (cond) days++;
    else break;
  }
  result.daysAbove = days;

  // 突破/跌破时的放量倍数（取最近5天最大量 vs 20日均量）
  const recent5 = data.slice(n - 5);
  const maxVol = Math.max(...recent5.map(d => d.volume));
  result.volumeRatio = ind_vma20(data) > 0 ? (maxVol / ind_vma20(data)) : 1;

  // 回抽确认：突破后曾回踩颈线但未跌破
  if (days >= 2 && days < 8) {
    const pullbackDays = data.slice(n - 10, n - 2);
    const touchedNeckline = pullbackDays.some(d => !isBear ?
      (d.low <= neckline * 1.02 && d.close > neckline) :
      (d.high >= neckline * 0.98 && d.close < neckline));
    if (touchedNeckline) result.pullbackTest = true;
  }

  // 评分
  if (aboveNeckline) {
    let score = 30;
    if (days >= 3) score += 25;
    else if (days >= 2) score += 15;
    if (result.volumeRatio > 1.5) score += 20;
    else if (result.volumeRatio > 1.2) score += 10;
    if (result.pullbackTest) score += 25;
    result.score = Math.min(100, score);
    result.confirmed = days >= 2;
    result.detail = `${isBear?'跌破':'突破'}颈线${neckline.toFixed(2)}已${days}天，放量${result.volumeRatio.toFixed(1)}倍${result.pullbackTest?'，回抽确认有效':''}`;
  }

  return result;
}

// 辅助：获取20日均量
function ind_vma20(data) {
  if (data.length < 20) return 0;
  return data.slice(-20).reduce((s, d) => s + d.volume, 0) / 20;
}

      const leftHigher = leftShoulder && leftShoulder > head;
      const rightHigher = rightShoulder && rightShoulder > head;
      const symmetry = leftShoulder && rightShoulder ? Math.abs(leftShoulder - rightShoulder) / leftShoulder < 0.2 : false;
      const broken = curPrice > neckline * 0.98;
      const rightShoulderGlobalIdx = headIdx + 3 + rightShoulderIdx;
      const rightShoulderDone = rightShoulderGlobalIdx < lookback - 3;

      hsDetail.score = (leftHigher?20:5)+(rightHigher?20:5)+(symmetry?20:5)+(broken?40:10);
      hsDetail.points = [
        { label: '左肩', value: leftShoulder ? leftShoulder.toFixed(2) : '-' },
        { label: '头部', value: head.toFixed(2) },
        { label: '右肩', value: rightShoulder ? rightShoulder.toFixed(2) : '构建中' },
        { label: '颈线位', value: neckline.toFixed(2) },
        { label: '当前价', value: curPrice.toFixed(2) }
      ];
      // 图上标注
      if (leftShoulderIdx >= 0) {
        hsDetail.markers.points.push({ idx: n - lookback + leftShoulderIdx, price: leftShoulder, label: '左肩', color: '#3498db' });
      }
      hsDetail.markers.points.push({ idx: n - lookback + headIdx, price: head, label: '头', color: '#e74c3c' });
      if (rightShoulderDone && rightShoulderIdx >= 0) {
        hsDetail.markers.points.push({ idx: n - lookback + rightShoulderGlobalIdx, price: rightShoulder, label: '右肩', color: '#3498db' });
      }
      hsDetail.markers.lines = [{ price: neckline, label: '头肩底颈线', color: '#f39c12' }];
      if (!leftHigher) {
        hsDetail.stage = '头肩底不成立：左肩未高于头部';
        hsDetail.outlook = '形态不标准';
        hsDetail.action = '观望';
      } else if (!rightShoulderDone) {
        hsDetail.stage = '右肩构建中：头部已形成，正在构建右肩';
        hsDetail.outlook = '右肩低点应高于头部，右肩完成后关注颈线突破';
        hsDetail.action = '轻仓布局，止损设头部下方';
      } else if (!rightHigher) {
        hsDetail.stage = '右肩低于头部：头肩底形态可能失败';
        hsDetail.outlook = '右肩创新低，下跌趋势可能延续';
        hsDetail.action = '观望或止损';
      } else if (!broken) {
        hsDetail.stage = '右肩已完成，向颈线推进：突破前夜';
        hsDetail.outlook = '放量突破颈线则头肩底确认，最小涨幅=头部到颈线距离';
        hsDetail.action = '可布局，突破颈线加仓';
      } else {
        const pullback = curPrice < neckline * 1.05 && data[last].low < neckline * 1.02;
        if (pullback) {
          hsDetail.stage = '头肩底突破后回踩颈线确认中';
          hsDetail.outlook = '回踩不破颈线则确认有效，开启上涨';
          hsDetail.action = '回踩企稳加仓，破颈线止损';
        } else {
          hsDetail.stage = '头肩底已突破颈线：形态确认，上涨进行中';
          hsDetail.outlook = '目标价=颈线+(颈线-头部)，沿均线持股';
          hsDetail.action = '持股待涨';
        }
      }
    }
  }
  results.hs_bottom = hsDetail;

  // ===== 4. 平台突破 =====
  let pbDetail = { score: 0, stage: '', points: [], outlook: '', action: '', markers: { points: [], lines: [] } };
  const platLen = Math.min(35, n - 5);
  if (platLen >= 15) {
    const platStart = n - platLen - 5;
    const plat = data.slice(platStart, n - 5);
    const platHigh = Math.max(...plat.map(d => d.high));
    const platLow = Math.min(...plat.map(d => d.low));
    const range = (platHigh - platLow) / platLow;
    const tight = range < 0.18;
    const breakout = curPrice > platHigh * 1.01;
    const volBoost = data[last].volume > ind.vma5[last] * 1.3;
    const maConverge = ind.ma5[last] && ind.ma20[last] && Math.abs(ind.ma5[last] - ind.ma20[last]) / ind.ma20[last] < 0.06;
    const nearTop = curPrice > platHigh * 0.97 && !breakout;
    const afterBreakout = data.slice(n - 10);
    const hadBreakout = afterBreakout.some(d => d.close > platHigh * 1.02);
    const pullbackToPlatform = hadBreakout && curPrice < platHigh * 1.03 && curPrice > platHigh * 0.97;

    pbDetail.score = (tight?30:10)+(breakout?35:10)+(volBoost?20:5)+(maConverge?15:5);
    pbDetail.points = [
      { label: '平台上沿', value: platHigh.toFixed(2) },
      { label: '平台下沿', value: platLow.toFixed(2) },
      { label: '平台振幅', value: (range*100).toFixed(1)+'%' },
      { label: '当前价', value: curPrice.toFixed(2) }
    ];
    // 图上标注
    pbDetail.markers.lines = [
      { price: platHigh, label: '平台上沿', color: '#e74c3c' },
      { price: platLow, label: '平台下沿', color: '#2ecc71' },
    ];
    // 标注平台起点和终点
    pbDetail.markers.points = [
      { idx: platStart, price: platHigh, label: '平台起点', color: '#9b59b6' },
      { idx: n - 6, price: platHigh, label: '平台末端', color: '#9b59b6' },
    ];
    if (!tight) {
      pbDetail.stage = '非平台整理：振幅过大，不是标准平台';
      pbDetail.outlook = '整理不充分，突破可靠性低';
      pbDetail.action = '观望';
    } else if (nearTop && !breakout) {
      pbDetail.stage = '平台整理末端：价格接近平台上沿，突破前夜';
      pbDetail.outlook = '均线粘合，蓄势充分，放量突破则开启新一波上涨';
      pbDetail.action = '可提前布局，突破上沿加仓';
    } else if (breakout && volBoost) {
      pbDetail.stage = '放量突破平台：突破确认，上涨启动';
      pbDetail.outlook = '放量突破可靠性高，最小涨幅=平台高度，沿均线持股';
      pbDetail.action = '突破日买入，回踩平台上沿加仓';
    } else if (breakout && !volBoost) {
      pbDetail.stage = '缩量突破平台：突破但量能不足，需确认';
      pbDetail.outlook = '缩量突破可能是假突破，需观察后续量能';
      pbDetail.action = '轻仓参与，若回踩跌破平台则止损';
    } else if (pullbackToPlatform) {
      pbDetail.stage = '突破后回踩平台上沿确认中';
      pbDetail.outlook = '回踩不破平台上沿则确认有效，是加仓良机';
      pbDetail.action = '回踩企稳加仓，跌破平台上沿止损';
    } else if (hadBreakout) {
      pbDetail.stage = '平台突破后上涨中：趋势延续';
      pbDetail.outlook = '突破有效，沿均线持股，目标看平台高度量度涨幅';
      pbDetail.action = '持股待涨';
    } else {
      pbDetail.stage = '平台整理中：在区间内震荡，尚未选择方向';
      pbDetail.outlook = '整理越充分，突破后空间越大；关注上沿突破或下沿破位';
      pbDetail.action = '区间内高抛低吸，突破上沿跟进';
    }
  }
  results.platform_break = pbDetail;

  return results;
}

// ============ 下降形态匹配 ============
function matchBearPatterns(data, ind) {
  const n = data.length;
  const last = n - 1;
  const results = {};
  const lookback = Math.min(80, n - 1);
  const seg = data.slice(n - lookback);
  const highs = seg.map(d => d.high);
  const lows = seg.map(d => d.low);
  const curPrice = data[last].close;

  // ===== 1. 均线空头排列 =====
  let maBear = { score: 0, stage: '', points: [], outlook: '', action: '', markers: { points: [], lines: [] } };
  if (ind.ma5[last] && ind.ma10[last] && ind.ma20[last] && ind.ma60[last]) {
    const c1 = ind.ma5[last] < ind.ma10[last];
    const c2 = ind.ma10[last] < ind.ma20[last];
    const c3 = ind.ma20[last] < ind.ma60[last];
    const c4 = curPrice < ind.ma5[last];
    const ma5Slope = ind.ma5[last] - ind.ma5[Math.max(0,last-5)];
    const c5 = ma5Slope < 0;
    maBear.score = (c1?25:0)+(c2?25:0)+(c3?20:0)+(c4?15:0)+(c5?15:0);
    maBear.points = [
      { label: 'MA5', value: ind.ma5[last].toFixed(2) },
      { label: 'MA10', value: ind.ma10[last].toFixed(2) },
      { label: 'MA20', value: ind.ma20[last].toFixed(2) },
      { label: 'MA60', value: ind.ma60[last].toFixed(2) }
    ];
    const belowAll = c1 && c2 && c3;
    if (belowAll && c4 && ma5Slope < -0.02 * curPrice) {
      maBear.stage = '下跌趋势中期：均线完美空头，沿MA5下行';
      maBear.outlook = '下跌趋势明确，反弹不过MA20则继续下跌';
      maBear.action = '止损离场，不要抄底，等待均线扭转';
    } else if (belowAll && c4) {
      maBear.stage = '下跌趋势初期：均线刚形成空头排列';
      maBear.outlook = '空头刚确立，后续可能有反弹确认，确认后继续下跌';
      maBear.action = '减仓或止损，反弹不过MA20离场';
    } else if (belowAll && !c4) {
      maBear.stage = '下跌趋势反弹中：价格突破MA5，测试MA10/MA20压力';
      maBear.outlook = '若在MA20遇阻则继续下跌，突破MA20则可能止跌';
      maBear.action = '反弹减仓，突破MA20再观察';
    } else if (c1 && c2 && !c3) {
      maBear.stage = '均线粘合向下发散初期：短期均线已空头，MA20即将下穿MA60';
      maBear.outlook = '死亡交叉前夜，破位后可能开启主跌浪';
      maBear.action = '警惕MA20下穿MA60，破位离场';
    } else {
      maBear.stage = '均线未形成空头排列';
      maBear.outlook = '下跌趋势尚未确立';
      maBear.action = '暂不判定为空头，继续观察';
    }
  }
  results.ma_bear = maBear;

  // ===== 2. M头/双头 =====
  let mTop = { score: 0, stage: '', points: [], outlook: '', action: '', markers: { points: [], lines: [] } };
  const maxHigh = Math.max(...highs);
  const maxIdx = highs.indexOf(maxHigh);
  if (maxIdx > 5 && maxIdx < lookback - 8) {
    const leftHighs = highs.slice(0, maxIdx - 2);
    const leftHigh = leftHighs.length > 0 ? Math.max(...leftHighs) : maxHigh;
    const leftHighIdx = leftHighs.length > 0 ? leftHighs.indexOf(leftHigh) : -1;
    const rightHighs = highs.slice(maxIdx + 3);
    const rightHigh = rightHighs.length > 0 ? Math.max(...rightHighs) : maxHigh;
    const rightHighIdx = maxIdx + 3 + (rightHighs.length > 0 ? rightHighs.indexOf(rightHigh) : 0);
    const neckline = Math.min(...lows.slice(Math.max(0, maxIdx - 10), maxIdx + 3));
    const secondLower = rightHigh <= maxHigh * 1.03;
    const breakNeck = curPrice < neckline;
    const nearNeck = Math.abs(curPrice - neckline) / neckline < 0.03;
    const volConfirm = ind.vma5[last] > ind.vma20[last] * 1.1;

    mTop.score = (secondLower?40:10) + (breakNeck?35:15) + (volConfirm?25:10);
    mTop.points = [
      { label: '左头', value: leftHigh.toFixed(2) },
      { label: '右头/最高点', value: Math.max(maxHigh, rightHigh).toFixed(2) },
      { label: '颈线位', value: neckline.toFixed(2) },
      { label: '当前价', value: curPrice.toFixed(2) }
    ];
    if (leftHighIdx >= 0) mTop.markers.points.push({ idx: n - lookback + leftHighIdx, price: leftHigh, label: '左头', color: '#e74c3c' });
    mTop.markers.points.push({ idx: n - lookback + maxIdx, price: maxHigh, label: '头', color: '#e74c3c' });
    if (rightHighIdx < lookback - 3) mTop.markers.points.push({ idx: n - lookback + rightHighIdx, price: rightHigh, label: '右头', color: '#e74c3c' });
    mTop.markers.lines = [{ price: neckline, label: 'M头颈线', color: '#f39c12' }];

    if (!secondLower) {
      mTop.stage = 'M头不成立：第二个高点高于第一个，可能是上升趋势';
      mTop.outlook = '形态失败，继续创新高可能';
      mTop.action = '不判定为见顶，继续持股观察';
    } else if (nearNeck && !breakNeck) {
      mTop.stage = 'M头破位前夜：价格接近颈线，岌岌可危';
      mTop.outlook = '放量跌破颈线则确认M头，最小跌幅=头部到颈线距离';
      mTop.action = '减仓警惕，跌破颈线立即止损';
    } else if (breakNeck) {
      const pullback = curPrice > neckline * 0.97 && data[last].high > neckline;
      if (pullback) {
        mTop.stage = 'M头破位后回抽确认中：价格回抽颈线';
        mTop.outlook = '回抽不过颈线则确认有效，后续下跌概率大';
        mTop.action = '回抽是最后逃命机会，不过颈线离场';
      } else {
        mTop.stage = 'M头已跌破颈线：顶部确认，下跌进行中';
        mTop.outlook = '最小目标=颈线-(头部-颈线)，沿均线持币';
        mTop.action = '止损离场，不要抄底';
      }
    } else {
      mTop.stage = 'M头构建中：右头已形成，向颈线下跌';
      mTop.outlook = '关注颈线支撑，跌破则确认顶部';
      mTop.action = '减仓，跌破颈线清仓';
    }
  }
  results.m_top = mTop;

  // ===== 3. 头肩顶 =====
  let hsTop = { score: 0, stage: '', points: [], outlook: '', action: '', markers: { points: [], lines: [] } };
  if (lookback > 30) {
    const headIdx = highs.indexOf(Math.max(...highs));
    if (headIdx > 8 && headIdx < lookback - 8) {
      const leftPart = highs.slice(0, headIdx - 3);
      const rightPart = highs.slice(headIdx + 3);
      const leftShoulder = leftPart.length > 0 ? Math.max(...leftPart) : null;
      const leftShoulderIdx = leftPart.length > 0 ? leftPart.indexOf(leftShoulder) : -1;
      const rightShoulder = rightPart.length > 0 ? Math.max(...rightPart) : null;
      const rightShoulderIdx = rightPart.length > 0 ? rightPart.indexOf(rightShoulder) : -1;
      const head = highs[headIdx];
      const neckLeft = Math.min(...lows.slice(0, headIdx));
      const neckRight = rightPart.length > 0 ? Math.min(...lows.slice(headIdx + 3)) : neckLeft;
      const neckline = Math.max(neckLeft, neckRight);
      const leftLower = leftShoulder && leftShoulder < head;
      const rightLower = rightShoulder && rightShoulder < head;
      const symmetry = leftShoulder && rightShoulder ? Math.abs(leftShoulder - rightShoulder) / leftShoulder < 0.2 : false;
      const broken = curPrice < neckline * 1.02;
      const rightShoulderGlobalIdx = headIdx + 3 + rightShoulderIdx;
      const rightShoulderDone = rightShoulderGlobalIdx < lookback - 3;

      hsTop.score = (leftLower?20:5)+(rightLower?20:5)+(symmetry?20:5)+(broken?40:10);
      hsTop.points = [
        { label: '左肩', value: leftShoulder ? leftShoulder.toFixed(2) : '-' },
        { label: '头部', value: head.toFixed(2) },
        { label: '右肩', value: rightShoulder ? rightShoulder.toFixed(2) : '构建中' },
        { label: '颈线位', value: neckline.toFixed(2) },
        { label: '当前价', value: curPrice.toFixed(2) }
      ];
      if (leftShoulderIdx >= 0) hsTop.markers.points.push({ idx: n - lookback + leftShoulderIdx, price: leftShoulder, label: '左肩', color: '#3498db' });
      hsTop.markers.points.push({ idx: n - lookback + headIdx, price: head, label: '头', color: '#e74c3c' });
      if (rightShoulderDone && rightShoulderIdx >= 0) hsTop.markers.points.push({ idx: n - lookback + rightShoulderGlobalIdx, price: rightShoulder, label: '右肩', color: '#3498db' });
      hsTop.markers.lines = [{ price: neckline, label: '头肩顶颈线', color: '#f39c12' }];

      if (!leftLower) {
        hsTop.stage = '头肩顶不成立：左肩未低于头部';
        hsTop.outlook = '形态不标准';
        hsTop.action = '观望';
      } else if (!rightShoulderDone) {
        hsTop.stage = '右肩构建中：头部已形成，正在构建右肩';
        hsTop.outlook = '右肩高点应低于头部，右肩完成后关注颈线破位';
        hsTop.action = '减仓，止损设头部上方';
      } else if (!rightLower) {
        hsTop.stage = '右肩高于头部：头肩顶形态可能失败';
        hsTop.outlook = '右肩创新高，上升趋势可能延续';
        hsTop.action = '观望或继续持股';
      } else if (!broken) {
        hsTop.stage = '右肩已完成，向颈线下行：破位前夜';
        hsTop.outlook = '放量跌破颈线则头肩顶确认，最小跌幅=头部到颈线距离';
        hsTop.action = '可减仓，跌破颈线清仓';
      } else {
        const pullback = curPrice > neckline * 0.95 && data[last].high > neckline;
        if (pullback) {
          hsTop.stage = '头肩顶破位后回抽颈线确认中';
          hsTop.outlook = '回抽不过颈线则确认有效，开启下跌';
          hsTop.action = '回抽是最后离场机会，不过颈线清仓';
        } else {
          hsTop.stage = '头肩顶已跌破颈线：顶部确认，下跌进行中';
          hsTop.outlook = '目标价=颈线-(头部-颈线)，沿均线持币';
          hsTop.action = '止损离场，不要抄底';
        }
      }
    }
  }
  results.hs_top = hsTop;

  // ===== 4. 平台破位 =====
  let pbDown = { score: 0, stage: '', points: [], outlook: '', action: '', markers: { points: [], lines: [] } };
  const platLen = Math.min(35, n - 5);
  if (platLen >= 15) {
    const platStart = n - platLen - 5;
    const plat = data.slice(platStart, n - 5);
    const platHigh = Math.max(...plat.map(d => d.high));
    const platLow = Math.min(...plat.map(d => d.low));
    const range = (platHigh - platLow) / platLow;
    const tight = range < 0.18;
    const breakdown = curPrice < platLow * 0.99;
    const volBoost = data[last].volume > ind.vma5[last] * 1.3;
    const maConverge = ind.ma5[last] && ind.ma20[last] && Math.abs(ind.ma5[last] - ind.ma20[last]) / ind.ma20[last] < 0.06;
    const nearBottom = curPrice < platLow * 1.03 && !breakdown;
    const afterBreakdown = data.slice(n - 10);
    const hadBreakdown = afterBreakdown.some(d => d.close < platLow * 0.98);
    const pullbackToPlatform = hadBreakdown && curPrice > platLow * 0.97 && curPrice < platLow * 1.03;

    pbDown.score = (tight?30:10)+(breakdown?35:10)+(volBoost?20:5)+(maConverge?15:5);
    pbDown.points = [
      { label: '平台上沿', value: platHigh.toFixed(2) },
      { label: '平台下沿', value: platLow.toFixed(2) },
      { label: '平台振幅', value: (range*100).toFixed(1)+'%' },
      { label: '当前价', value: curPrice.toFixed(2) }
    ];
    pbDown.markers.lines = [
      { price: platHigh, label: '平台上沿', color: '#e74c3c' },
      { price: platLow, label: '平台下沿', color: '#2ecc71' },
    ];
    pbDown.markers.points = [
      { idx: platStart, price: platLow, label: '平台起点', color: '#9b59b6' },
      { idx: n - 6, price: platLow, label: '平台末端', color: '#9b59b6' },
    ];
    if (!tight) {
      pbDown.stage = '非平台整理：振幅过大，不是标准平台';
      pbDown.outlook = '整理不充分，破位可靠性低';
      pbDown.action = '观望';
    } else if (nearBottom && !breakdown) {
      pbDown.stage = '平台整理末端：价格接近平台下沿，破位前夜';
      pbDown.outlook = '均线粘合，蓄势充分，放量破位则开启新一波下跌';
      pbDown.action = '警惕破位，跌破下沿立即止损';
    } else if (breakdown && volBoost) {
      pbDown.stage = '放量跌破平台：破位确认，下跌启动';
      pbDown.outlook = '放量破位可靠性高，最小跌幅=平台高度，沿均线持币';
      pbDown.action = '破位日立即止损，不要抱有幻想';
    } else if (breakdown && !volBoost) {
      pbDown.stage = '缩量跌破平台：破位但量能不足，需确认';
      pbDown.outlook = '缩量破位可能是假破位，需观察后续量能';
      pbDown.action = '减仓观察，若反弹不过平台则清仓';
    } else if (pullbackToPlatform) {
      pbDown.stage = '破位后回抽平台下沿确认中';
      pbDown.outlook = '回抽不过平台下沿则确认有效，是最后离场机会';
      pbDown.action = '回抽清仓，突破平台下沿再观察';
    } else if (hadBreakdown) {
      pbDown.stage = '平台破位后下跌中：趋势延续';
      pbDown.outlook = '破位有效，沿均线持币，目标看平台高度量度跌幅';
      pbDown.action = '持币观望，不要抄底';
    } else {
      pbDown.stage = '平台整理中：在区间内震荡，尚未选择方向';
      pbDown.outlook = '整理越充分，破位后空间越大；关注下沿破位或上沿突破';
      pbDown.action = '区间内高抛低吸，破下沿止损';
    }
  }
  results.platform_break_down = pbDown;

  return results;
}

// ============ 量价分析 ============
function analyzeVolume(data, ind) {
  const n = data.length;
  const last = n - 1;
  const v5 = ind.vma5[last] || 0;
  const v20 = ind.vma20[last] || 0;
  const volRatio = v20 > 0 ? (v5 / v20) : 1;
  const recent5 = data.slice(n - 5);
  const priceUp = recent5[4].close > recent5[0].close;
  const volUp = v5 > (ind.vma5[n-6] || v5);
  let relation = '量价平稳';
  if (priceUp && volUp) relation = '量价齐升（健康上涨）';
  else if (priceUp && !volUp) relation = '价涨量缩（上涨乏力，警惕）';
  else if (!priceUp && volUp) relation = '价跌量增（抛压较重）';
  else if (!priceUp && !volUp) relation = '价跌量缩（正常回调）';
  const todayVol = data[last].volume;
  const volStatus = todayVol > v5 * 1.5 ? '放量' : todayVol < v5 * 0.7 ? '缩量' : '正常';
  return { volRatio: volRatio.toFixed(2), relation, volStatus, v5: Math.round(v5), v20: Math.round(v20) };
}

// ============ 大盘环境判断 ============
function analyzeMarketEnv(data) {
  if (!data || data.length < 60) return { score: 50, stage: '数据不足', trend: 'neutral', advice: '大盘数据不足，暂不评估', impact: 0 };
  const n = data.length;
  const last = n - 1;
  const ind = calcIndicators(data);
  const curPrice = data[last].close;
  const ma20 = ind.ma20[last] || curPrice;
  const ma60 = ind.ma60[last] || curPrice;
  const ma120 = ind.ma120 ? ind.ma120[last] : ma60;
  
  // 计算20日涨跌幅
  const price20ago = data[Math.max(0, last - 20)].close;
  const change20 = ((curPrice - price20ago) / price20ago * 100);
  
  // 均线状态
  const aboveMa20 = curPrice > ma20;
  const aboveMa60 = curPrice > ma60;
  const ma20Up = ma20 > (ind.ma20[Math.max(0, last - 5)] || ma20);
  const ma60Up = ma60 > (ind.ma60[Math.max(0, last - 10)] || ma60);
  const maBull = ind.ma5[last] > ind.ma10[last] && ind.ma10[last] > ma20 && ma20 > ma60;
  const maBear = ind.ma5[last] < ind.ma10[last] && ind.ma10[last] < ma20 && ma20 < ma60;
  
  // 波动率（20日振幅）
  const recent20 = data.slice(n - 20);
  const high20 = Math.max(...recent20.map(d => d.high));
  const low20 = Math.min(...recent20.map(d => d.low));
  const volatility = ((high20 - low20) / low20 * 100);
  
  // 评分
  let score = 50;
  if (maBull) score += 25;
  if (maBear) score -= 25;
  if (aboveMa20) score += 8; else score -= 8;
  if (aboveMa60) score += 8; else score -= 8;
  if (ma20Up) score += 5; else score -= 5;
  if (ma60Up) score += 4; else score -= 4;
  if (change20 > 5) score += 5;
  if (change20 < -5) score -= 5;
  score = Math.max(0, Math.min(100, score));
  
  // 阶段判断
  let stage, trend, advice, impact;
  if (score >= 75) {
    stage = '强势上升'; trend = 'bull';
    advice = '大盘强势，个股突破形态成功率高，可积极操作';
    impact = 10; // 对推荐度的加成
  } else if (score >= 60) {
    stage = '震荡偏强'; trend = 'bull';
    advice = '大盘偏强，个股机会较多，注意选股质量';
    impact = 5;
  } else if (score >= 45) {
    stage = '震荡整理'; trend = 'neutral';
    advice = '大盘震荡，个股分化严重，精选个股，控制仓位';
    impact = 0;
  } else if (score >= 30) {
    stage = '震荡偏弱'; trend = 'bear';
    advice = '大盘偏弱，注意假突破，降低仓位，快进快出';
    impact = -8;
  } else {
    stage = '弱势下降'; trend = 'bear';
    advice = '大盘弱势，个股普跌，建议空仓或轻仓，不要抄底';
    impact = -15;
  }
  
  return {
    score, stage, trend, advice, impact,
    price: curPrice.toFixed(2),
    change20: change20.toFixed(2),
    ma20: ma20.toFixed(2),
    ma60: ma60.toFixed(2),
    volatility: volatility.toFixed(1),
    aboveMa20, aboveMa60, maBull, maBear
  };
}

// ============ RSI + KDJ 信号检测 ============
function detectRSIKDJ(data, ind) {
  const n = data.length;
  const last = n - 1;
  const rsi = ind.rsi[last];
  const k = ind.kdj_k[last], d = ind.kdj_d[last], j = ind.kdj_j[last];
  const prevK = ind.kdj_k[last-1] || k, prevD = ind.kdj_d[last-1] || d;
  
  // KDJ金叉/死叉
  const kdjGolden = prevK <= prevD && k > d;
  const kdjDeath = prevK >= prevD && k < d;
  
  // RSI超买超卖
  const rsiOverbought = rsi > 70;
  const rsiOversold = rsi < 30;
  const rsiUpFromOversold = ind.rsi[last-1] < 30 && rsi >= 30;
  const rsiDownFromOverbought = ind.rsi[last-1] > 70 && rsi <= 70;
  
  // 底部买入信号：RSI从超卖回升 + KDJ金叉
  const bottomSignal = (rsiOversold || rsiUpFromOversold) && (kdjGolden || k < 30);
  // 顶部卖出信号：RSI超买 + KDJ死叉
  const topSignal = (rsiOverbought || rsiDownFromOverbought) && (kdjDeath || k > 70);
  
  let signal = '中性';
  let score = 0;
  if (bottomSignal) { signal = '底部买入信号'; score = 15; }
  else if (topSignal) { signal = '顶部卖出信号'; score = -15; }
  else if (rsi < 40 && k < 40) { signal = '弱势区域，观望'; score = -5; }
  else if (rsi > 60 && k > 60) { signal = '强势区域，持股'; score = 5; }
  
  return {
    rsi: rsi.toFixed(1), k: k.toFixed(1), d: d.toFixed(1), j: j.toFixed(1),
    kdjGolden, kdjDeath, rsiOverbought, rsiOversold,
    bottomSignal, topSignal, signal, score,
    detail: `RSI=${rsi.toFixed(1)} K=${k.toFixed(1)} D=${d.toFixed(1)}${kdjGolden?' KDJ金叉':''}${kdjDeath?' KDJ死叉':''}${rsiOverbought?' RSI超买':''}${rsiOversold?' RSI超卖':''}`
  };
}

// ============ 布林带收口突破检测 ============
function detectBollinger(data, ind) {
  const n = data.length;
  const last = n - 1;
  const curPrice = data[last].close;
  const up = ind.boll_up[last], low = ind.boll_low[last], mid = ind.boll_mid[last];
  const width = ind.boll_width[last];
  
  // 计算6个月内布林带宽度百分位
  const widths = ind.boll_width.slice(Math.max(0, n-120));
  const sortedWidths = [...widths].sort((a,b) => a-b);
  const widthPercentile = sortedWidths.findIndex(w => w >= width) / sortedWidths.length * 100;
  const isSqueeze = widthPercentile < 25; // 收口：宽度在历史25%分位以下
  
  // 突破上轨/下轨
  const breakUp = curPrice > up;
  const breakDown = curPrice < low;
  const nearUp = curPrice > up * 0.98 && curPrice <= up;
  const nearDown = curPrice < low * 1.02 && curPrice >= low;
  
  // 收口后突破（高可靠性信号）
  const squeezeBreakUp = isSqueeze && breakUp;
  const squeezeBreakDown = isSqueeze && breakDown;
  
  let signal = '正常波动';
  let score = 0;
  if (squeezeBreakUp) { signal = '收口后放量突破上轨（高可靠）'; score = 12; }
  else if (squeezeBreakDown) { signal = '收口后跌破下轨（高可靠）'; score = -12; }
  else if (breakUp) { signal = '突破上轨（强势）'; score = 5; }
  else if (breakDown) { signal = '跌破下轨（弱势）'; score = -5; }
  else if (isSqueeze) { signal = '布林带收口，变盘在即'; score = 0; }
  
  return {
    up: up.toFixed(2), mid: mid.toFixed(2), low: low.toFixed(2),
    width: width.toFixed(2), widthPercentile: widthPercentile.toFixed(0),
    isSqueeze, breakUp, breakDown, squeezeBreakUp, squeezeBreakDown,
    signal, score,
    detail: `上轨${up.toFixed(2)} 中轨${mid.toFixed(2)} 下轨${low.toFixed(2)} 带宽${width.toFixed(2)}%（历史${widthPercentile.toFixed(0)}%分位）${isSqueeze?' 收口':''}`
  };
}

// ============ 相对强度计算 ============
function calcRelativeStrength(data, marketData) {
  if (!marketData || marketData.length < 20) return { score: 0, level: '暂无数据', detail: '大盘数据不足' };
  const n = data.length;
  const stock20 = (data[n-1].close - data[Math.max(0,n-20)].close) / data[Math.max(0,n-20)].close * 100;
  const m = marketData.length;
  const market20 = (marketData[m-1].close - marketData[Math.max(0,m-20)].close) / marketData[Math.max(0,m-20)].close * 100;
  const rs = stock20 - market20; // 相对强度：个股跑赢大盘的幅度
  
  let level, score;
  if (rs > 15) { level = '极强（领涨）'; score = 10; }
  else if (rs > 5) { level = '强势（跑赢）'; score = 6; }
  else if (rs > -5) { level = '中性（同步）'; score = 0; }
  else if (rs > -15) { level = '弱势（跑输）'; score = -6; }
  else { level = '极弱（领跌）'; score = -10; }
  
  return {
    stock20: stock20.toFixed(2), market20: market20.toFixed(2),
    rs: rs.toFixed(2), level, score,
    detail: `个股20日${stock20>=0?'+':''}${stock20.toFixed(2)}% vs 大盘${market20>=0?'+':''}${market20.toFixed(2)}%，相对强度${rs>=0?'+':''}${rs.toFixed(2)}%`
  };
}

// ============ ATR动态止损位 ============
function calcATRStopLoss(data, ind) {
  const n = data.length;
  const last = n - 1;
  const atr = ind.atr[last];
  const curPrice = data[last].close;
  const atrPct = atr / curPrice * 100; // ATR占价格百分比
  
  // 不同止损倍数
  const stop1x = curPrice - 1.0 * atr;
  const stop15x = curPrice - 1.5 * atr;
  const stop2x = curPrice - 2.0 * atr;
  
  // 波动率等级
  let volLevel;
  if (atrPct < 2) volLevel = '低波动';
  else if (atrPct < 4) volLevel = '中波动';
  else if (atrPct < 6) volLevel = '高波动';
  else volLevel = '极高波动';
  
  return {
    atr: atr.toFixed(2), atrPct: atrPct.toFixed(2),
    stop1x: stop1x.toFixed(2), stop15x: stop15x.toFixed(2), stop2x: stop2x.toFixed(2),
    volLevel,
    detail: `ATR(14)=${atr.toFixed(2)}（${atrPct.toFixed(2)}%，${volLevel}），建议止损位=${stop15x.toFixed(2)}（1.5倍ATR，约${(1.5*atrPct).toFixed(1)}%）`
  };
}

// ============ 周线数据提取与形态匹配 ============
function extractWeeklyData(data) {
  const weekly = [];
  let week = [];
  for (let i = 0; i < data.length; i++) {
    const date = new Date(data[i].date);
    const dayOfWeek = date.getDay();
    week.push(data[i]);
    if (dayOfWeek === 5 || i === data.length - 1) {
      if (week.length > 0) {
        weekly.push({
          date: week[week.length-1].date,
          open: week[0].open,
          high: Math.max(...week.map(d => d.high)),
          low: Math.min(...week.map(d => d.low)),
          close: week[week.length-1].close,
          volume: week.reduce((a,b) => a + b.volume, 0)
        });
      }
      week = [];
    }
  }
  return weekly;
}

function matchWeeklyPatterns(data) {
  if (data.length < 20) return { score: 0, signal: '周线数据不足', detail: '需要至少20周数据' };
  const ind = calcIndicators(data);
  const n = data.length;
  const last = n - 1;
  const curPrice = data[last].close;
  
  // 周线均线多头
  const maBull = ind.ma5[last] > ind.ma10[last] && ind.ma10[last] > ind.ma20[last] && ind.ma20[last] > ind.ma60[last];
  const maBear = ind.ma5[last] < ind.ma10[last] && ind.ma10[last] < ind.ma20[last] && ind.ma20[last] < ind.ma60[last];
  
  // 周线MACD金叉/死叉
  const macdGolden = ind.dif[last-1] <= ind.dea[last-1] && ind.dif[last] > ind.dea[last];
  const macdDeath = ind.dif[last-1] >= ind.dea[last-1] && ind.dif[last] < ind.dea[last];
  const macdAboveZero = ind.dif[last] > 0;
  
  // 周线RSI
  const rsi = ind.rsi[last];
  
  let bullScore = 0, bearScore = 0, signals = [];
  if (maBull) { bullScore += 30; signals.push('周线均线多头'); }
  if (maBear) { bearScore += 30; signals.push('周线均线空头'); }
  if (macdGolden) { bullScore += 25; signals.push('周线MACD金叉'); }
  if (macdDeath) { bearScore += 25; signals.push('周线MACD死叉'); }
  if (macdAboveZero) { bullScore += 15; } else { bearScore += 15; }
  if (rsi > 60) { bullScore += 10; }
  if (rsi < 40) { bearScore += 10; }
  if (curPrice > ind.ma20[last]) { bullScore += 10; } else { bearScore += 10; }
  
  const isBull = bullScore > bearScore;
  const score = isBull ? bullScore : bearScore;
  const type = isBull ? 'bull' : 'bear';
  const signal = isBull ? '周线偏多' : '周线偏空';
  const resonance = score >= 60; // 周线与日线共振
  
  return {
    score, type, signal, resonance,
    bullScore, bearScore,
    rsi: rsi.toFixed(1),
    macdGolden, macdDeath, maBull, maBear,
    detail: `${signals.join('、')}，周线RSI=${rsi.toFixed(1)}，${resonance?'周线日线共振':'周线未确认'}`
  };
}

// ============ 支撑压力位 ============
function calcLevels(data, ind) {
  const n = data.length;
  const recent = data.slice(Math.max(0, n - 60));
  const high = Math.max(...recent.map(d => d.high));
  const low = Math.min(...recent.map(d => d.low));
  const last20 = data.slice(n - 20);
  const high20 = Math.max(...last20.map(d => d.high));
  const low20 = Math.min(...last20.map(d => d.low));
  return {
    support: [
      { label: 'MA20', value: ind.ma20[n-1]?.toFixed(2) },
      { label: 'MA60', value: ind.ma60[n-1]?.toFixed(2) },
      { label: '20日低点', value: low20.toFixed(2) },
      { label: '60日低点', value: low.toFixed(2) }
    ].filter(s => s.value),
    resistance: [
      { label: '20日高点', value: high20.toFixed(2) },
      { label: '60日高点', value: high.toFixed(2) }
    ]
  };
}

// ============ K线图绘制 ============
function drawKline(canvas, data, ind, startIdx, endIdx, showMA, markers) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 320 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 320;
  const padL = 50, padR = 70, padT = 10, padB = 25;
  const volH = 60;
  const priceH = H - padT - padB - volH - 10;
  const slice = data.slice(startIdx, endIdx);
  if (slice.length === 0) return;
  const highs = slice.map(d => d.high), lows = slice.map(d => d.low);
  let maxP = Math.max(...highs), minP = Math.min(...lows);
  // 包含标注线的价格范围
  if (markers && markers.lines) {
    markers.lines.forEach(l => {
      if (l.price > maxP) maxP = l.price;
      if (l.price < minP) minP = l.price;
    });
  }
  maxP *= 1.02; minP *= 0.98;
  const pRange = maxP - minP || 1;
  const maxV = Math.max(...slice.map(d => d.volume)) || 1;
  const cw = (W - padL - padR) / slice.length;
  const bw = Math.max(1, cw * 0.6);

  ctx.fillStyle = '#1a2332';
  ctx.fillRect(0, 0, W, H);

  // 网格
  ctx.strokeStyle = '#2a3441';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = padT + priceH * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    const price = maxP - pRange * i / 4;
    ctx.fillStyle = '#556677'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(price.toFixed(2), padL - 5, y + 3);
  }

  // K线
  slice.forEach((d, i) => {
    const x = padL + i * cw + cw / 2;
    const isUp = d.close >= d.open;
    ctx.strokeStyle = isUp ? '#e74c3c' : '#2ecc71';
    ctx.fillStyle = isUp ? '#e74c3c' : '#2ecc71';
    const yH = padT + (maxP - d.high) / pRange * priceH;
    const yL = padT + (maxP - d.low) / pRange * priceH;
    const yO = padT + (maxP - d.open) / pRange * priceH;
    const yC = padT + (maxP - d.close) / pRange * priceH;
    ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
    const bodyTop = Math.min(yO, yC), bodyH = Math.max(1, Math.abs(yC - yO));
    ctx.fillRect(x - bw/2, bodyTop, bw, bodyH);
    // 成交量
    const vh = d.volume / maxV * volH;
    const vy = padT + priceH + 10 + volH - vh;
    ctx.globalAlpha = 0.6;
    ctx.fillRect(x - bw/2, vy, bw, vh);
    ctx.globalAlpha = 1;
  });

  // 均线
  if (showMA) {
    const maColors = { ma5: '#f39c12', ma10: '#3498db', ma20: '#9b59b6', ma60: '#1abc9c' };
    ['ma5','ma10','ma20','ma60'].forEach(key => {
      const ma = ind[key];
      ctx.strokeStyle = maColors[key];
      ctx.lineWidth = 1;
      ctx.beginPath();
      let started = false;
      slice.forEach((d, i) => {
        const idx = startIdx + i;
        const v = ma[idx];
        if (v == null) return;
        const x = padL + i * cw + cw / 2;
        const y = padT + (maxP - v) / pRange * priceH;
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      });
      ctx.stroke();
    });
  }

  // ===== 形态标注 =====
  if (markers) {
    // 水平线（颈线、平台上下沿）
    if (markers.lines) {
      markers.lines.forEach(line => {
        const y = padT + (maxP - line.price) / pRange * priceH;
        if (y < padT || y > padT + priceH) return;
        ctx.strokeStyle = line.color || '#f39c12';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
        ctx.setLineDash([]);
        // 右侧标签
        ctx.fillStyle = line.color || '#f39c12';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(line.label + ' ' + line.price.toFixed(2), W - padR + 4, y + 4);
      });
    }
    // 关键点（左底、右底、左肩、头部、右肩等）
    if (markers.points) {
      markers.points.forEach(pt => {
        const localIdx = pt.idx - startIdx;
        if (localIdx < 0 || localIdx >= slice.length) return;
        const x = padL + localIdx * cw + cw / 2;
        const y = padT + (maxP - pt.price) / pRange * priceH;
        if (y < padT - 10 || y > padT + priceH + 10) return;
        // 画圆圈
        ctx.strokeStyle = pt.color || '#e74c3c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = pt.color || '#e74c3c';
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        // 标签
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        const labelY = y - 12 < padT + 5 ? y + 18 : y - 10;
        ctx.fillStyle = '#0f1419';
        ctx.fillRect(x - 18, labelY - 9, 36, 13);
        ctx.fillStyle = pt.color || '#e74c3c';
        ctx.fillText(pt.label, x, labelY);
      });
    }
  }

  // 日期标签
  ctx.fillStyle = '#556677'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(slice.length / 6));
  for (let i = 0; i < slice.length; i += step) {
    const x = padL + i * cw + cw / 2;
    ctx.fillText(slice[i].date.slice(5), x, H - 8);
  }
}

async function doAnalyze() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code || !/^\d{6}$/.test(code)) { alert('请输入6位股票代码'); return; }
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true; btn.textContent = '分析中...';
  const area = document.getElementById('resultArea');
  area.innerHTML = '<div class="loading"><div class="spinner"></div>正在拉取K线数据并分析...</div>';
  try {
    // 并行拉取个股和大盘数据
    const [result, marketData] = await Promise.all([
      fetchKline(code),
      fetchSinaKlineJSONP('sh000001').catch(() => null) // 上证指数
    ]);
    if (!result.data || result.data.length < 30) throw new Error('数据不足');
    const marketEnv = marketData && marketData.length > 60 ? analyzeMarketEnv(marketData) : null;
    renderAnalysis(result, marketEnv);
  } catch (e) {
    area.innerHTML = `<div class="error-msg">数据获取失败：${e.message}。请检查代码是否正确，或使用CSV上传功能。</div>
      <div class="csv-upload"><label>上传CSV文件分析 <input type="file" accept=".csv" onchange="handleCSV(event)"></label></div>`;
  } finally {
    btn.disabled = false; btn.textContent = '开始分析';
  }
}

function openStockInNewTab(code) {
  const url = new URL(window.location.href);
  url.searchParams.set('code', code);
  window.open(url.toString(), '_blank');
}

function handleCSV(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const lines = ev.target.result.split('\n').filter(l => l.trim());
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 6) {
        data.push({
          date: cols[0].replace(/[^\d-]/g, ''),
          open: parseFloat(cols[1]), high: parseFloat(cols[2]),
          low: parseFloat(cols[3]), close: parseFloat(cols[4]),
          volume: parseFloat(cols[5])
        });
      }
    }
    if (data.length < 30) { alert('CSV数据不足'); return; }
    renderAnalysis({ name: file.name.replace('.csv',''), code: 'CSV', data });
  };
  reader.readAsText(file);
}

// ============ 关注推荐度指数 ============
function calcAttentionScore(data, ind, matches, vol, bearMatches, macdDiv, volDiv, neckConfirm) {
  const n = data.length;
  const last = n - 1;
  const sorted = Object.entries(matches).sort((a, b) => b[1].score - a[1].score);
  const bearSorted = Object.entries(bearMatches).sort((a, b) => b[1].score - a[1].score);
  const bestId = sorted[0][0];
  const bestDetail = sorted[0][1];
  const bestScore = bestDetail.score;
  const bestStage = bestDetail.stage || '';
  const bearBestScore = bearSorted[0][1].score;
  const bearBestId = bearSorted[0][0];
  const breakdown = [];

  // 1. 基础分：形态匹配度
  let score = bestScore;
  breakdown.push({ label: '形态匹配度', value: bestScore, max: 100 });

  // 2. 形态可靠性权重
  const weights = { ma_bull: 1.0, w_bottom: 1.0, hs_bottom: 1.1, platform_break: 1.05 };
  const w = weights[bestId] || 1;
  const weightBonus = Math.round(bestScore * (w - 1));
  score += weightBonus;
  if (weightBonus !== 0) breakdown.push({ label: '形态可靠性加成', value: weightBonus > 0 ? '+' + weightBonus : weightBonus });

  // 3. 阶段加成
  let stageBonus = 0;
  if (bestStage.includes('突破前夜') || bestStage.includes('末端') || bestStage.includes('向颈线推进')) stageBonus = 12;
  else if (bestStage.includes('已突破') || bestStage.includes('突破确认') || bestStage.includes('上涨进行中') || bestStage.includes('上涨启动')) stageBonus = 15;
  else if (bestStage.includes('主升浪')) stageBonus = 12;
  else if (bestStage.includes('回踩') || bestStage.includes('确认中')) stageBonus = 8;
  else if (bestStage.includes('构建中') || bestStage.includes('酝酿') || bestStage.includes('右肩')) stageBonus = 3;
  else if (bestStage.includes('失败') || bestStage.includes('不成立') || bestStage.includes('非标准') || bestStage.includes('非平台')) stageBonus = -15;
  score += stageBonus;
  breakdown.push({ label: '当前阶段加成', value: stageBonus > 0 ? '+' + stageBonus : stageBonus });

  // 4. 量价配合
  let volBonus = 0;
  if (vol.volStatus === '放量') volBonus += 6;
  if (vol.relation.includes('量价齐升')) volBonus += 6;
  if (vol.relation.includes('价涨量缩')) volBonus -= 4;
  if (vol.relation.includes('价跌量增')) volBonus -= 4;
  if (parseFloat(vol.volRatio) > 1.2) volBonus += 4;
  score += volBonus;
  breakdown.push({ label: '量价配合加成', value: volBonus > 0 ? '+' + volBonus : volBonus });

  // 5. 均线状态
  let maBonus = 0;
  if (ind.ma5[last] && ind.ma10[last] && ind.ma20[last] && ind.ma60[last]) {
    if (ind.ma5[last] > ind.ma10[last] && ind.ma10[last] > ind.ma20[last] && ind.ma20[last] > ind.ma60[last]) maBonus += 10;
    else if (ind.ma5[last] > ind.ma10[last] && ind.ma10[last] > ind.ma20[last]) maBonus += 5;
    if (data[last].close > ind.ma20[last]) maBonus += 4;
    if (data[last].close > ind.ma60[last]) maBonus += 4;
  }
  score += maBonus;
  breakdown.push({ label: '均线状态加成', value: maBonus > 0 ? '+' + maBonus : maBonus });

  // 6. 多形态共振（前两名匹配度都高）
  let resonanceBonus = 0;
  if (sorted[1] && sorted[1][1].score >= 50) {
    resonanceBonus = 5;
    score += resonanceBonus;
    breakdown.push({ label: '多形态共振', value: '+5' });
  }

  // 7. 下降形态风险扣分
  let riskPenalty = 0;
  if (bearBestScore >= 70) {
    riskPenalty = -25;
    breakdown.push({ label: '见顶风险扣分', value: '-25' });
  } else if (bearBestScore >= 50) {
    riskPenalty = -15;
    breakdown.push({ label: '见顶风险扣分', value: '-15' });
  } else if (bearBestScore >= 35) {
    riskPenalty = -5;
    breakdown.push({ label: '见顶风险扣分', value: '-5' });
  }
  score += riskPenalty;

  // 8. 增强信号：MACD背离 + 量价背离 + 颈线确认
  if (macdDiv || volDiv || neckConfirm) {
    let enhanceBonus = 0;
    // MACD底背离加分（底部信号增强）
    if (macdDiv && macdDiv.bottomDivergence >= 50) { enhanceBonus += 12; breakdown.push({ label: 'MACD底背离', value: '+12' }); }
    else if (macdDiv && macdDiv.bottomDivergence >= 30) { enhanceBonus += 6; breakdown.push({ label: 'MACD底背离', value: '+6' }); }
    // MACD顶背离扣分（顶部信号增强）
    if (macdDiv && macdDiv.topDivergence >= 50) { enhanceBonus -= 12; breakdown.push({ label: 'MACD顶背离', value: '-12' }); }
    else if (macdDiv && macdDiv.topDivergence >= 30) { enhanceBonus -= 6; breakdown.push({ label: 'MACD顶背离', value: '-6' }); }
    // 量价背离
    if (volDiv && volDiv.bottomVolumeDivergence >= 50) { enhanceBonus += 8; breakdown.push({ label: '底部量价背离', value: '+8' }); }
    if (volDiv && volDiv.topVolumeDivergence >= 50) { enhanceBonus -= 8; breakdown.push({ label: '顶部量价背离', value: '-8' }); }
    if (volDiv && volDiv.shrinkStop >= 50) { enhanceBonus += 8; breakdown.push({ label: '缩量止跌', value: '+8' }); }
    if (volDiv && volDiv.volumeStagnation >= 50) { enhanceBonus -= 8; breakdown.push({ label: '放量滞涨', value: '-8' }); }
    // 颈线确认度
    if (neckConfirm && neckConfirm.score >= 70) { enhanceBonus += 10; breakdown.push({ label: '颈线确认', value: '+10' }); }
    else if (neckConfirm && neckConfirm.score >= 50) { enhanceBonus += 5; breakdown.push({ label: '颈线确认', value: '+5' }); }
    score += enhanceBonus;
  }

  // 限制范围
  score = Math.max(0, Math.min(100, Math.round(score)));

  // 等级
  let level, levelColor, advice;
  const bearName = BEAR_PATTERNS.find(p => p.id === bearBestId)?.name || '';
  if (bearBestScore >= 60) {
    level = 'S级·风险警示'; levelColor = '#2ecc71';
    advice = `检测到${bearName}（${bearBestScore}%），见顶信号强烈，建议立即止盈止损，不要抄底`;
  } else if (score >= 85) { level = 'A级·强烈推荐'; levelColor = '#e74c3c'; advice = '重点关注，形态+量价+均线共振，可考虑建仓'; }
  else if (score >= 70) { level = 'B级·推荐关注'; levelColor = '#e67e22'; advice = '值得关注，形态较好，等待最佳入场点'; }
  else if (score >= 55) { level = 'C级·值得观察'; levelColor = '#f1c40f'; advice = '加入观察池，等待形态进一步确认'; }
  else if (score >= 40) { level = 'D级·一般'; levelColor = '#3498db'; advice = '形态未确立，暂不重点关注'; }
  else { level = 'E级·暂不关注'; levelColor = '#7f8c8d'; advice = '形态不佳，建议回避'; }

  return { score, level, levelColor, advice, breakdown, bestPattern: bestId };
}

function renderAnalysis(result, marketEnv) {
  const { name, code, data } = result;
  const ind = calcIndicators(data);
  const matches = matchPatterns(data, ind);
  const bearMatches = matchBearPatterns(data, ind);
  const vol = analyzeVolume(data, ind);
  const levels = calcLevels(data, ind);
  const n = data.length;
  const last = data[n - 1];
  const prev = data[n - 2];
  const change = last.close - prev.close;
  const pct = (change / prev.close * 100).toFixed(2);
  const cls = change >= 0 ? 'up' : 'down';

  // 最佳匹配（综合上升和下降形态）
  const sorted = Object.entries(matches).sort((a, b) => b[1].score - a[1].score);
  const bearSorted = Object.entries(bearMatches).sort((a, b) => b[1].score - a[1].score);
  const bullBestScore = sorted[0][1].score;
  const bearBestScore = bearSorted[0][1].score;
  const isBearDominant = bearBestScore > bullBestScore && bearBestScore >= 50;
  let best, bestDetail, bestScore, bestInterp, bestType;
  if (isBearDominant) {
    best = BEAR_PATTERNS.find(p => p.id === bearSorted[0][0]);
    bestDetail = bearMatches[bearSorted[0][0]];
    bestScore = bestDetail.score;
    bestType = 'bear';
  } else {
    best = PATTERNS.find(p => p.id === sorted[0][0]);
    bestDetail = matches[sorted[0][0]];
    bestScore = bestDetail.score;
    bestType = 'bull';
  }

  // 增强信号检测（依赖bestDetail）
  const macdDiv = detectMACDDivergence(data, ind);
  const volDiv = detectVolumeDivergence(data, ind);
  const neckConfirm = calcNecklineConfirm(data, bestDetail, bestType === 'bear');
  const attention = calcAttentionScore(data, ind, matches, vol, bearMatches, macdDiv, volDiv, neckConfirm);

  // ===== 形态完成度与当前阶段 =====
  const patternReliability = best.reliability_pct || 75;
  const patternSampleNote = best.sample_note || '';
  // 完成度：形态得分/100，结合颈线确认度调整
  let completion = bestScore;
  if (neckConfirm.score > 0) completion = Math.min(100, completion + neckConfirm.score * 0.2);
  completion = Math.round(completion);
  // 综合可信度 = 经典可靠性 * 完成度 * 大盘环境
  const envMultiplier = marketEnv ? (1 + marketEnv.impact / 100) : 1;
  const overallConfidence = Math.round(patternReliability * (completion / 100) * envMultiplier);
  const currentStage = bestDetail.stage || '形态形成中';
  const currentOutlook = bestDetail.outlook || '';
  const currentAction = bestDetail.action || '';

  // ===== 新增5大增强指标 =====
  const rsiKdj = detectRSIKDJ(data, ind);
  const bollinger = detectBollinger(data, ind);
  const relativeStrength = calcRelativeStrength(data, marketEnv ? null : null); // 需要大盘数据，后面处理

  // 相对强度需要大盘20日涨跌，从marketEnv获取
  if (marketEnv) {
    const stock20 = ((data[n-1].close - data[Math.max(0,n-20)].close) / data[Math.max(0,n-20)].close * 100);
    const rs = stock20 - parseFloat(marketEnv.change20);
    relativeStrength.stock20 = stock20.toFixed(2);

// ============ 自选股池管理（localStorage持久化） ============
const WATCHLIST_KEY = 'kline_watchlist_v1';
let watchlistResults = {}; // code -> result 对象，缓存分析结果

// 从localStorage读取自选股
function getWatchlist() {
  try {
    const data = localStorage.getItem(WATCHLIST_KEY);
    return data ? JSON.parse(data) : [];
  } catch(e) { return []; }
}

// 保存自选股到localStorage
function saveWatchlist(codes) {
  try { localStorage.setItem(WATCHLIST_KEY, JSON.stringify(codes)); } catch(e) {}
}

// 渲染自选股标签
function renderWatchlistTags() {
  const codes = getWatchlist();
  const container = document.getElementById('watchlistTags');
  if (codes.length === 0) {
    container.innerHTML = '<span style="font-size:13px;color:#556677;">暂无自选股，请在上方输入代码添加</span>';
    return;
  }
  container.innerHTML = codes.map(code => {
    const name = watchlistResults[code]?.name || code;
    return `<span style="display:inline-flex;align-items:center;gap:6px;background:#1a2332;border:1px solid #2a3441;border-radius:14px;padding:4px 8px 4px 12px;font-size:13px;">
      <span style="color:#f0f0f0">${name}</span>
      <span style="color:#556677;font-size:11px">${code}</span>
      <button onclick="removeStock('${code}')" style="background:none;border:none;color:#8899aa;cursor:pointer;font-size:14px;padding:0 2px;line-height:1;" title="删除">×</button>
    </span>`;
  }).join('');
}

// 添加股票
function addStock() {
  const input = document.getElementById('addStockInput');
  const code = input.value.trim();
  if (!/^\d{6}$/.test(code)) { alert('请输入6位股票代码'); return; }
  const codes = getWatchlist();
  if (codes.includes(code)) { alert('该股票已在自选股池中'); return; }
  codes.push(code);
  saveWatchlist(codes);
  input.value = '';
  renderWatchlistTags();
  // 自动分析这只股票
  analyzeSingleStock(code);
}

// 删除股票
function removeStock(code) {
  let codes = getWatchlist();
  codes = codes.filter(c => c !== code);
  saveWatchlist(codes);
  delete watchlistResults[code];
  renderWatchlistTags();
  renderWatchlistTable();
}

// 清空全部
function clearAllWatchlist() {
  if (!confirm('确定清空全部自选股吗？')) return;
  saveWatchlist([]);
  watchlistResults = {};
  renderWatchlistTags();
  document.getElementById('batchResults').innerHTML = '';
  document.getElementById('batchStatus').textContent = '';
}

// 加载示例自选股
function loadExampleWatchlist() {
  const examples = ['002436', '600519', '002594', '300750', '601318', '000858'];
  let codes = getWatchlist();
  examples.forEach(c => { if (!codes.includes(c)) codes.push(c); });
  saveWatchlist(codes);
  renderWatchlistTags();
  analyzeAllWatchlist();
}

// 分析单只股票（添加时自动调用）
async function analyzeSingleStock(code) {
  const status = document.getElementById('batchStatus');
  status.textContent = `正在分析 ${code}...`;
  try {
    const result = await fetchKline(code);
    if (result && result.data && result.data.length > 20) {
      const r = calculateStockResult(result);
      watchlistResults[code] = r;
      renderWatchlistTags(); // 更新标签中的股票名称
      renderWatchlistTable();
      status.textContent = `已添加 ${r.name} (${code})`;
    }
  } catch(e) { console.error(code, e); status.textContent = `分析 ${code} 失败`; }
}

// 计算单只股票的分析结果（复用逻辑）
function calculateStockResult(result) {
  const code = result.code;
  const ind = calcIndicators(result.data);
  const matches = matchPatterns(result.data, ind);
  const bearMatches = matchBearPatterns(result.data, ind);
  const vol = analyzeVolume(result.data, ind);
  const sorted = Object.entries(matches).sort((a,b) => b[1].score - a[1].score);
  const bearSorted = Object.entries(bearMatches).sort((a,b) => b[1].score - a[1].score);
  const isBearDom = bearSorted[0][1].score > sorted[0][1].score && bearSorted[0][1].score >= 50;
  const bestDetail = isBearDom ? bearMatches[bearSorted[0][0]] : matches[sorted[0][0]];
  const bestType = isBearDom ? 'bear' : 'bull';
  const macdDiv = detectMACDDivergence(result.data, ind);
  const volDiv = detectVolumeDivergence(result.data, ind);
  const neckConfirm = calcNecklineConfirm(result.data, bestDetail, bestType === 'bear');
  const attention = calcAttentionScore(result.data, ind, matches, vol, bearMatches, macdDiv, volDiv, neckConfirm);
  const last = result.data[result.data.length - 1];
  const prev = result.data[result.data.length - 2];
  const pct = ((last.close - prev.close) / prev.close * 100).toFixed(2);
  return {
    code, name: result.name, price: last.close, pct,

  status.textContent = `正在分析 0/${codes.length}...`;

  for (let i = 0; i < codes.length; i++) {
    const code = codes[i];
    status.textContent = `正在分析 ${i+1}/${codes.length}: ${code}...`;
    try {
      const result = await fetchKline(code);
      if (result && result.data && result.data.length > 20) {

  }
  status.textContent = `完成：共分析 ${Object.keys(watchlistResults).length} 只股票`;
}

// 扫描结果缓存
let scanResults = [];

// 开始市场扫描
async function startMarketScan() {
  const checked = document.querySelectorAll('.sector-checkbox:checked');
  if (checked.length === 0) { alert('请至少选择一个板块'); return; }
  const sectors = getAllSectors();
  let allCodes = [];
  checked.forEach(cb => {
    const codes = sectors[cb.value] || [];
    allCodes = allCodes.concat(codes);
  });
  // 去重
  allCodes = [...new Set(allCodes)];
  if (allCodes.length === 0) { alert('未获取到股票代码'); return; }

  const minScore = parseInt(document.getElementById('scanMinScore').value);
  const signalType = document.getElementById('scanSignalType').value;
  const status = document.getElementById('scanStatus');
  const progressDiv = document.getElementById('scanProgress');
  const progressBar = document.getElementById('scanProgressBar');
  const resultsDiv = document.getElementById('scanResults');

  progressDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  scanResults = [];

  // 信号类型过滤函数
  function passSignalFilter(r) {
    if (signalType === 'bull') return r.bullScore >= 50 && r.bearScore < 50;
    if (signalType === 'bear') return r.bearScore >= 50 && r.bullScore < 50;
    return true; // all
  }

  const signalLabel = signalType === 'bull' ? '底部信号' : signalType === 'bear' ? '顶部信号' : '全部';

  // 并发控制：同时最多5个请求
  const CONCURRENCY = 5;
  let completed = 0;
  let index = 0;

  async function worker() {
    while (index < allCodes.length) {
      const code = allCodes[index++];
      try {
        const result = await fetchKline(code);
        if (result && result.data && result.data.length > 20) {
          const r = calculateStockResult(result);
          if (r.attention >= minScore && passSignalFilter(r)) {
            scanResults.push(r);
            renderScanResults();
          }
        }
      } catch(e) { console.error(code, e); }
      completed++;
      progressBar.style.width = (completed / allCodes.length * 100) + '%';
      status.textContent = `正在扫描 ${completed}/${allCodes.length}，已筛选 ${scanResults.length} 只`;
    }
  }

  // 启动并发worker
  const workers = [];
  for (let i = 0; i < Math.min(CONCURRENCY, allCodes.length); i++) {
    workers.push(worker());
  }
  await Promise.all(workers);

  status.textContent = `扫描完成：共扫描 ${allCodes.length} 只，筛选出 ${scanResults.length} 只（${signalLabel}，推荐度≥${minScore}分）`;
}
