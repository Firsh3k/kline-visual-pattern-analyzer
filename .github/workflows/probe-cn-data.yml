# 临时：测试海外云服务器（GitHub Actions）能否访问国内行情 / 同花顺接口。测完删除。
name: probe-cn-data
on:
  push:
    branches: [ 'claude/project-thread-04zuq3' ]
    paths: [ '.github/workflows/probe-cn-data.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.12' }
    - name: curl endpoints
      run: |
        for u in "https://d.10jqka.com.cn/v2/blockrank/886032/199112/d1000.js" \
                 "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=sz002436,day,,,5,qfq" \
                 "https://qt.gtimg.cn/q=sz002436" \
                 "https://quotes.sina.cn/cn/api/jsonp_v2.php/cb/CN_MarketDataService.getKLineData?symbol=sz002436&scale=240&ma=no&datalen=3"; do
          echo "== $u"; curl -sS -m 20 -A "Mozilla/5.0" -e "https://q.10jqka.com.cn/" -o /tmp/out -w "HTTP %{http_code} size %{size_download}\n" "$u" || true
          head -c 200 /tmp/out; echo
        done
    - name: python ths_web + LiveProvider
      working-directory: services/analysis_api
      run: |
        pip install -q -r requirements.txt
        python -m app.ths_web 886032 | head -c 600 || true
        python -c "
        import sys; sys.path.insert(0,'../..')
        from app.providers import LiveProvider
        f = LiveProvider().daily('002436','qfq'); print('bars', len(f.bars), 'last', f.bars[-1]['day'], f.provenance['source'])
        f = LiveProvider().index_daily(); print('index bars', len(f.bars), 'last', f.bars[-1]['day'])
        "
