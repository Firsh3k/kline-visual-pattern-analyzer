# 本地 / 自托管 Staging 编排：BFF（公开 8080，前置 HTTPS 反向代理）+ Python 分析服务（仅内网）。
# 用法：cp deploy/.env.example deploy/.env  # 填写密钥
#       docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: kline-v6
services:
  analysis:
    build:
      context: ..
      dockerfile: services/analysis_api/Dockerfile
      args:
        ENGINE_VERSION: ${RELEASE_VERSION:-}
        ENGINE_COMMIT: ${RELEASE_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    environment:
      ANALYSIS_API_TOKEN: ${ANALYSIS_API_TOKEN:?必须设置}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-live}
      FIXTURE_DIR: /srv/services/analysis_api/fixtures
      DEPLOY_ENV: ${DEPLOY_ENV:-staging}
    volumes:
      - analysis-data:/data
    networks: [internal]
    restart: unless-stopped
  bff:
    build:
      context: ..
      dockerfile: apps/bff/Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-}
        RELEASED_AT: ${RELEASED_AT:-}
        RELEASE_ENV: ${DEPLOY_ENV:-staging}
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-staging}
      PYTHON_API_BASE_URL: http://analysis:8000
      PYTHON_API_PRIVATE_NETWORK: "true"        # compose 内网，Python 服务不对外暴露
      PYTHON_API_TOKEN: ${ANALYSIS_API_TOKEN:?必须设置}
      SESSION_SECRET: ${SESSION_SECRET:?必须设置}
      LOGIN_USERNAME: ${LOGIN_USERNAME:?必须设置}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:?必须设置}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    ports:
      - "${BFF_PORT:-8080}:8080"
    depends_on: [analysis]
    networks: [internal, public]
    restart: unless-stopped
volumes:
  analysis-data:
networks:
  internal:   # analysis 不发布端口，只能经 BFF 访问；保留出站以拉取行情
  public:
